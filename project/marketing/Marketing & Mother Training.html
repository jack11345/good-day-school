<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Good Day School — Marketing Pack & Mother Training</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#f0eee9;height:100%;overflow:hidden;}
  body{font-family:'DM Sans',-apple-system,sans-serif;}
  /* Shared atoms for all pieces — print-quality */
  .gds-medallion{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--maroon-deep);color:var(--gold-soft);font-family:'Cormorant Garamond',serif;font-weight:600;flex-shrink:0;line-height:1;}
  .gds-medallion::after{content:'';position:absolute;inset:3px;border-radius:50%;border:1px solid var(--gold);}
  .gds-medallion::before{content:'';position:absolute;inset:8px;border-radius:50%;border:1px dashed var(--gold);opacity:.5;}
  .gds-medallion .gds-star{position:absolute;top:13%;left:50%;transform:translateX(-50%);color:var(--gold);font-size:.3em;line-height:1;}
  .gds-medallion .gds-ticks{position:absolute;bottom:14%;left:50%;transform:translateX(-50%);color:var(--gold);font-size:.26em;letter-spacing:.55em;opacity:.85;}
  .gds-medallion.gold-on-dark{background:var(--gold);color:var(--maroon-deep);}
  .gds-medallion.gold-on-dark::after,.gds-medallion.gold-on-dark::before{border-color:var(--maroon-deep);opacity:.55;}
  .gds-medallion.gold-on-dark .gds-star,.gds-medallion.gold-on-dark .gds-ticks{color:var(--maroon-deep);}
  .gds-medallion.outline{background:transparent;border:1.5px solid var(--gold);color:var(--gold);}
  .gds-medallion.outline::after,.gds-medallion.outline::before{display:none;}

  .gds-lockup{display:flex;align-items:center;gap:14px;}
  .gds-lockup .gds-words{display:flex;flex-direction:column;line-height:1;}
  .gds-lockup .gds-name{font-family:'Cormorant Garamond',serif;color:var(--maroon-deep);letter-spacing:.04em;font-weight:600;}
  .gds-lockup .gds-div{height:1px;background:var(--gold);margin:5px 0;}
  .gds-lockup .gds-school{font-family:'DM Sans',sans-serif;letter-spacing:.36em;color:var(--ink-soft);font-weight:500;}
  .gds-lockup .gds-est{font-family:'DM Sans',sans-serif;letter-spacing:.22em;color:var(--gold-deep,#B89651);margin-top:5px;}
  .gds-lockup.on-dark .gds-name{color:var(--cream);}
  .gds-lockup.on-dark .gds-school{color:var(--gold-soft);}
  .gds-lockup.on-dark .gds-est{color:var(--gold);opacity:.85;}

  .gds-eyebrow{font-family:'DM Sans',sans-serif;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--maroon);display:inline-flex;align-items:center;gap:12px;}
  .gds-eyebrow::before,.gds-eyebrow.bookended::after{content:'';height:1px;background:currentColor;width:24px;}
  .gds-eyebrow.on-dark{color:var(--gold);}

  .gds-serif{font-family:'Cormorant Garamond',serif;}
  .gds-body{font-family:'Lora',Georgia,serif;}
  .gds-ui{font-family:'DM Sans',sans-serif;}
  .gds-urdu{font-family:'Noto Nastaliq Urdu',serif;direction:rtl;line-height:2;}

  /* Photo block — placeholder colors that read as imagery in print */
  .gds-photo{background-size:cover;background-position:center;position:relative;}
  .gds-photo.placeholder{background:linear-gradient(135deg,#8B6750,#4A1313 70%);display:flex;align-items:flex-end;padding:14px;color:rgba(232,217,181,.6);font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;}

  /* Print "paper" wrapper */
  .gds-paper{background:var(--cream);color:var(--ink);position:relative;overflow:hidden;}
  .gds-paper.cream-deep{background:var(--cream-deep);}
  .gds-paper.maroon{background:var(--maroon-deep);color:var(--cream);}

  /* Print marks */
  .gds-bleed{position:absolute;width:14px;height:14px;border:1px solid rgba(74,19,19,.25);}
  .gds-bleed.tl{top:8px;left:8px;border-right:none;border-bottom:none;}
  .gds-bleed.tr{top:8px;right:8px;border-left:none;border-bottom:none;}
  .gds-bleed.bl{bottom:8px;left:8px;border-right:none;border-top:none;}
  .gds-bleed.br{bottom:8px;right:8px;border-left:none;border-top:none;}

  /* hover lift for app tiles */
  .lift{transition:transform .25s, box-shadow .25s;}
  .lift:hover{transform:translateY(-3px);box-shadow:0 24px 40px -20px rgba(74,19,19,.35);}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="macos-window.jsx"></script>
<script type="text/babel" src="pieces/shared.jsx"></script>
<script type="text/babel" src="pieces/school-marketing.jsx"></script>
<script type="text/babel" src="pieces/mother-marketing.jsx"></script>
<script type="text/babel" src="pieces/mother-program.jsx"></script>
<script type="text/babel" src="pieces/mother-lms.jsx"></script>
<script type="text/babel" src="pieces/mother-print.jsx"></script>
<script type="text/babel" src="canvas-app.jsx"></script>
</body>
</html>
