<style>
:root {
  --maroon: #4A1313; --maroon-mid: #6B1F1F; --maroon-soft: #8B3333;
  --gold: #C9A961; --gold-light: #E8D9B5; --gold-pale: #F5EDD5;
  --cream: #FAF6EE; --cream-dark: #F0E8D8; --ink: #1A1008;
  --muted: #7A6A5A; --line: #D9CDB5; --white: #FFFFFF;
  --green: #2D7A4F; --red: #C0392B; --amber: #D4851A; --blue: #1A4A8B;
  --r: 10px; --shadow: 0 2px 10px rgba(74,19,19,.09);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--cream-dark); color: var(--ink); }
#root { height: 100%; }

/* Layout */
.shell { display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 220px; flex-shrink: 0;
  background: var(--maroon);
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.sidebar-brand {
  padding: 20px 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,.1);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-brand img { width: 36px; height: 36px; object-fit: contain; }
.sidebar-brand .name { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; color: var(--cream); line-height: 1.2; }
.sidebar-brand .sub { font-size: 10px; color: var(--gold); letter-spacing: .08em; }

/* Role switcher */
.role-switcher { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.1); }
.role-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: rgba(255,255,255,.4); margin-bottom: 6px; }
.role-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 8px; cursor: pointer;
  font-size: 12px; font-weight: 500; color: rgba(255,255,255,.65);
  border: none; background: transparent; width: 100%; text-align: left;
  transition: all .15s;
}
.role-chip:hover { background: rgba(255,255,255,.08); }
.role-chip.active { background: rgba(201,169,97,.18); color: var(--gold); }
.role-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* Nav items */
.nav-section { padding: 10px 14px 4px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: rgba(255,255,255,.3); margin-top: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 14px;
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,.65);
  cursor: pointer; border-radius: 8px; margin: 1px 8px;
  transition: all .15s; border: none; background: transparent; width: calc(100% - 16px); text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,.08); color: white; }
.nav-item.active { background: rgba(201,169,97,.22); color: var(--gold); font-weight: 600; }
.nav-item .icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.badge-pill { background: var(--gold); color: var(--maroon); font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-left: auto; }

/* Main content */
.main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.topbar {
  background: var(--white); border-bottom: 1px solid var(--line);
  padding: 0 28px; height: 56px;
  display: flex; align-items: center; gap: 16px; flex-shrink: 0;
}
.topbar-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700; color: var(--maroon); }
.topbar-sub { font-size: 12px; color: var(--muted); }
.topbar-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.topbar-btn {
  padding: 7px 16px; border-radius: var(--r); font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all .15s;
}
.topbar-btn.primary { background: var(--maroon-mid); color: var(--cream); border: none; }
.topbar-btn.primary:hover { background: var(--maroon); }
.topbar-btn.ghost { background: none; border: 1.5px solid var(--line); color: var(--ink); }
.topbar-btn.ghost:hover { border-color: var(--maroon-mid); color: var(--maroon-mid); }
.content { padding: 24px 28px; flex: 1; }

/* Cards & grids */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--white); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); }
.stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
.stat-value { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 700; color: var(--maroon); line-height: 1; }
.stat-delta { font-size: 11px; color: var(--green); margin-top: 4px; }
.stat-delta.neg { color: var(--red); }

.card { background: var(--white); border-radius: var(--r); box-shadow: var(--shadow); }
.card-header { padding: 16px 20px; border-bottom: 1px solid var(--cream-dark); display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 13px; font-weight: 600; color: var(--ink); }
.card-body { padding: 0; }

/* Tables */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { padding: 10px 16px; text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); background: var(--cream); border-bottom: 1px solid var(--line); }
.tbl td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--cream-dark); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: #FAFAF8; }

/* Badges */
.tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.tag.green { background: #E8F5EC; color: var(--green); }
.tag.red { background: #FAEAEA; color: var(--red); }
.tag.amber { background: #FEF6E0; color: var(--amber); }
.tag.blue { background: #E8F0FA; color: var(--blue); }
.tag.muted { background: var(--cream-dark); color: var(--muted); }

/* Kanban */
.kanban { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; }
.kanban-col { min-width: 200px; flex-shrink: 0; }
.kanban-col-head { padding: 10px 14px; border-radius: var(--r) var(--r) 0 0; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.kanban-card { background: var(--white); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; box-shadow: var(--shadow); cursor: pointer; border-left: 3px solid transparent; }
.kanban-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(74,19,19,.13); }
.kanban-name { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
.kanban-meta { font-size: 11px; color: var(--muted); }

/* Attendance grid */
.att-grid { display: grid; grid-template-columns: 2fr repeat(5, 1fr); gap: 0; }
.att-grid-head { padding: 8px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); background: var(--cream); border-bottom: 1px solid var(--line); }
.att-cell { padding: 10px 12px; border-bottom: 1px solid var(--cream-dark); font-size: 12px; display: flex; align-items: center; justify-content: center; }
.att-cell.name { justify-content: flex-start; font-weight: 500; color: var(--ink); }
.att-dot { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
.att-dot.P { background: #E8F5EC; color: var(--green); }
.att-dot.A { background: #FAEAEA; color: var(--red); }
.att-dot.L { background: #FEF6E0; color: var(--amber); }

/* Progress bars */
.progress-bar { background: var(--cream-dark); border-radius: 999px; height: 6px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 999px; background: var(--gold); }
.progress-fill.red { background: var(--red); }
.progress-fill.green { background: var(--green); }

/* Empty/Error states */
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--maroon); margin-bottom: 8px; }
.empty-sub { font-size: 13px; color: var(--muted); line-height: 1.6; }
.error-banner { background: #FEF0F0; border: 1px solid #F5C6C6; border-radius: var(--r); padding: 14px 18px; margin-bottom: 20px; display: flex; gap: 12px; align-items: flex-start; }
.offline-banner { background: #FEF6E0; border: 1px solid #F0D9A0; border-radius: var(--r); padding: 12px 18px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--amber); }

/* Responsive */
@media (max-width: 1100px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 900px) {
  .shell { flex-direction: column; }
  .sidebar { width: 100%; height: auto; flex-direction: row; overflow-x: auto; }
  .sidebar-brand { padding: 12px; flex-shrink: 0; }
  .role-switcher { display: flex; gap: 4px; padding: 8px; }
  .nav-section { display: none; }
  .nav-item { padding: 8px 12px; margin: 2px; flex-shrink: 0; }
  .main { flex: 1; }
}
@media (max-width: 600px) {
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .content { padding: 16px; }
  .topbar { padding: 0 16px; }
}
</style>

    const cur = att[id][4];
    const next = { P:'A', A:'L', L:'P' }[cur];
    setAtt(prev => { const n={...prev}; n[id]={...n[id]}; n[id][4]=next; return n; });
  };
  return (
    <div className="content">
      <div style={{ background:'var(--white)', borderRadius:'var(--r)', boxShadow:'var(--shadow)', overflow:'hidden' }}>
        <div className="att-grid">
          <div className="att-grid-head">Student</div>
          {DAYS.map(d => <div key={d} className="att-grid-head" style={{ textAlign:'center', background: d===today?'var(--gold-pale)':'' }}>{d}</div>)}
          {STUDENTS.map(s => (
            <>
              <div key={`n${s.id}`} className="att-cell name">{s.name}</div>
              {DAYS.map((d,di) => (
                <div key={`${s.id}-${di}`} className="att-cell">
                  <div
                    className={`att-dot ${att[s.id]?.[di]||'P'}`}
                    style={{ cursor: di===4?'pointer':'default' }}
                    onClick={() => di===4 && cycleStatus(s.id)}
                    title={di===4?'Click to toggle':''}
                  >{att[s.id]?.[di]||'P'}</div>
                </div>
              ))}
            </>
          ))}
        </div>
      </div>
      <div style={{ marginTop:12, fontSize:11, color:'var(--muted)' }}>P = Present · A = Absent · L = Late · Click today's column to toggle</div>
    </div>
  );
}

      <div style={{ background:'var(--cream)', borderRadius:16, padding:'40px 36px', width:360, boxShadow:'0 20px 60px rgba(0,0,0,.4)' }}>
        <div style={{ textAlign:'center', marginBottom:28 }}>
          <img src={LOGO} alt="Good Day School" style={{ width:72, height:72, objectFit:'contain', marginBottom:14 }}/>
          <div style={{ fontFamily:'Cormorant Garamond,serif', fontSize:26, fontWeight:700, color:'var(--maroon)' }}>Good Day School</div>
          <div style={{ fontSize:12, color:'var(--muted)', letterSpacing:'.1em', textTransform:'uppercase' }}>Staff Portal</div>
        </div>
        <div style={{ marginBottom:14 }}>
          <label style={{ fontSize:11, fontWeight:600, color:'var(--muted)', display:'block', marginBottom:6 }}>Login as</label>
          {Object.entries(ROLES).map(([k,v]) => (
            <button key={k} onClick={()=>setRole(k)} style={{
              display:'flex', alignItems:'center', gap:10,
              width:'100%', padding:'10px 14px', marginBottom:6,
              border:`1.5px solid ${role===k?'var(--maroon-mid)':'var(--line)'}`,
              borderRadius:8, background: role===k?'var(--gold-pale)':'white',
              cursor:'pointer', fontFamily:'DM Sans,sans-serif', fontSize:13, fontWeight:500,
            }}>
              <div style={{ width:10, height:10, borderRadius:'50%', background:v.dot }}/>
              {v.label}
            </button>
          ))}
        </div>
        <div style={{ marginBottom:14 }}>
          <label style={{ fontSize:11, fontWeight:600, color:'var(--muted)', display:'block', marginBottom:6 }}>Password</label>
          <input defaultValue="••••••••" type="password" style={{ width:'100%', padding:'11px 14px', border:'1.5px solid var(--line)', borderRadius:8, fontFamily:'DM Sans,sans-serif', fontSize:13, background:'var(--cream)', outline:'none' }}/>
        </div>
        <button onClick={()=>{ setScreen(role==='teacher'?'dashboard':role==='admin'?'admin_dash':'fee_dash'); setLoggedIn(true); }} style={{ width:'100%', background:'var(--maroon)', color:'var(--cream)', border:'none', borderRadius:8, padding:'14px', fontFamily:'DM Sans,sans-serif', fontSize:14, fontWeight:600, cursor:'pointer' }}>
          Sign in →
        </button>
      </div>
    </div>
  );

  const roleData = ROLES[role];
  const screenData = SCREENS[screen] || SCREENS['dashboard'];
  const Comp = screenData.component;

  return (
    <div className="shell">
      {/* Sidebar */}
      <div className="sidebar">
        <div className="sidebar-brand">
          <img src={LOGO} alt="Good Day School"/>
          <div>
            <div className="name">Good Day</div>
            <div className="sub">School LMS</div>
          </div>
        </div>
        <div className="role-switcher">
          <div className="role-label">Switch role</div>
          {Object.entries(ROLES).map(([k,v]) => (
            <button key={k} className={`role-chip ${role===k?'active':''}`} onClick={()=>{setRole(k); setScreen(k==='teacher'?'dashboard':k==='admin'?'admin_dash':'fee_dash');}}>
              <div className="role-dot" style={{ background:v.dot }}/>
              {v.label}
            </button>
          ))}
        </div>
        <div style={{ flex:1, overflow:'auto' }}>
          {roleData.nav.map((item,i) => {
            if (item.section) return <div key={i} className="nav-section">{item.section}</div>;
            return (
              <button key={item.key} className={`nav-item ${screen===item.key?'active':''}`} onClick={()=>setScreen(item.key)}>
                <span className="icon">{item.icon}</span>
                {item.label}
                {item.badge && <span className="badge-pill">{item.badge}</span>}
              </button>
            );
          })}
        </div>
        <div style={{ padding:'16px', borderTop:'1px solid rgba(255,255,255,.1)' }}>
          <div style={{ fontSize:11, color:'rgba(255,255,255,.4)', marginBottom:4 }}>Logged in as</div>
          <div style={{ fontSize:12, color:'var(--gold)', fontWeight:600 }}>{roleData.label} · Ms. Nadia</div>
          <button onClick={()=>setLoggedIn(false)} style={{ marginTop:8, fontSize:11, color:'rgba(255,255,255,.4)', background:'none', border:'none', cursor:'pointer', padding:0 }}>Sign out</button>
        </div>
      </div>

      {/* Main */}
      <div className="main">
        <div className="topbar">
          <div>
            <div className="topbar-title">{screenData.title}</div>
          </div>
          <div className="topbar-right">
            <span style={{ fontSize:12, color:'var(--muted)' }}>Sunday, 25 May 2026</span>
            <div style={{ width:32, height:32, borderRadius:'50%', background:'var(--maroon)', color:'var(--gold)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:700 }}>N</div>
          </div>
        </div>
        <Comp />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
