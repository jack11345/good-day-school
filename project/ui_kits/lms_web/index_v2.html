          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:32, fontWeight:600, color, lineHeight:1 }}>{v}</div>
          <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#8A7A6A', marginTop:4 }}>{s}</div>
        </div>
      ))}
    </div>
    <div style={{ display:'grid', gridTemplateColumns:'1.3fr 1fr', gap:18 }}>
      <Card>
        <CardHeader><span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:16, color:'#FAF6EE' }}>Today's class · Grade 3A</span><span onClick={()=>onNav('attendance')} style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#C9A961', cursor:'pointer' }}>Attendance →</span></CardHeader>
        <div style={{ padding:'8px 0' }}>
          {[...STUDENTS].slice(0,6).map(s=>{ const ss = statusStyle(s.status); return (
            <div key={s.id} style={{ display:'flex', alignItems:'center', gap:12, padding:'9px 20px', borderBottom:'1px solid #F2EBDB' }}>
              <Avatar initials={s.initials} size={32}/><span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:13, flex:1 }}>{s.name}</span>
              <Badge label={s.status} bg={ss.bg} color={ss.color}/>
            </div>
          );})}
        </div>
      </Card>
      <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
        <Card style={{ padding:18 }}>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:16, fontWeight:600, color:'#4A1313', marginBottom:12 }}>Quick actions</div>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {[['Take attendance →','attendance'],['Write daily notes →','notes'],['Quran tracker →','quran'],['Submit lesson plan →','lessons']].map(([l,k])=>(
              <button key={k} onClick={()=>onNav(k)} style={{ background:'#F2EBDB', border:'1px solid #D9CDB5', borderRadius:6, padding:'9px 14px', fontFamily:"'DM Sans',sans-serif", fontSize:12, color:'#4A1313', cursor:'pointer', textAlign:'left', transition:'background .15s' }}
                onMouseEnter={e=>e.target.style.background='#E8D9B5'} onMouseLeave={e=>e.target.style.background='#F2EBDB'}>{l}</button>
            ))}
          </div>
        </Card>
        <Card style={{ background:'#4A1313', padding:18 }}>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:16, color:'#E8D9B5', marginBottom:10 }}>Upcoming</div>
          {[['Sun 4 May','Week 19 lesson plans due'],['Wed 7 May','Parent–teacher meetings'],['Fri 9 May','Q3 report card deadline']].map(([d,e])=>(
            <div key={d} style={{ padding:'8px 0', borderBottom:'1px solid rgba(201,169,97,.15)', display:'flex', gap:12 }}>
              <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, color:'#C9A961', whiteSpace:'nowrap', marginTop:1 }}>{d}</span>
              <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:12, color:'#E8D9B5' }}>{e}</span>
            </div>
          ))}
        </Card>
      </div>
    </div>
  </div>
);

/* ── SCREEN TITLES ── */
const TITLES = {
  dashboard: ['Dashboard', 'Friday, 2 May 2026 · Grade 3A'],
  attendance: ['Attendance', 'Grade 3A · 12 students · Today'],
  notes: ['Daily Notes', 'Write and send today's notes by 3 PM'],
  quran: ['Quran Tracker', 'Sabaq · Sabqi · Manzil — daily entry'],
  lessons: ['Lesson Plans', 'Review, submit and approve weekly plans'],
  students: ['My Class', 'Grade 3A · 12 students enrolled'],
  reports: ['Report Cards', 'Q3 2025–2026 · Generate and review'],
  fees: ['Fees', 'May 2026 · Collection overview'],
  messages: ['Messages', '2 unread threads'],
};

/* ── LOGIN ── */
const LoginScreen = ({ onLogin }) => (
  <div style={{ minHeight:'100vh', background:'#4A1313', display:'flex', alignItems:'center', justifyContent:'center' }}>
    <div style={{ background:'#FAF6EE', borderRadius:12, padding:'48px 44px', width:380, boxShadow:'0 40px 80px -20px rgba(0,0,0,.5)' }}>
      <div style={{ textAlign:'center', marginBottom:32 }}>
        <div style={{ width:64, height:64, borderRadius:'50%', background:'#6B1F1F', margin:'0 auto 16px', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:"'Cormorant Garamond',serif", fontSize:30, fontWeight:600, color:'#E8D9B5', border:'3px solid #FAF6EE', boxShadow:'0 0 0 1.5px #C9A961' }}>G</div>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:26, fontWeight:600, color:'#4A1313' }}>Good Day School</div>
        <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, letterSpacing:'.18em', textTransform:'uppercase', color:'#8A7A6A', marginTop:4 }}>Teacher Portal · v2</div>
      </div>
      <div style={{ marginBottom:14 }}>
        <label style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, letterSpacing:'.14em', textTransform:'uppercase', color:'#5A4A4A', display:'block', marginBottom:5 }}>Email address</label>
        <input defaultValue="nadia.habib@gooddayschool.pk" style={{ width:'100%', padding:'11px 13px', border:'1px solid #D9CDB5', borderRadius:6, fontFamily:"'DM Sans',sans-serif", fontSize:13, background:'#FAF6EE', color:'#2A1A1A', outline:'none' }}/>
      </div>
      <div style={{ marginBottom:24 }}>
        <label style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, letterSpacing:'.14em', textTransform:'uppercase', color:'#5A4A4A', display:'block', marginBottom:5 }}>Password</label>
        <input type="password" placeholder="••••••••" style={{ width:'100%', padding:'11px 13px', border:'1px solid #D9CDB5', borderRadius:6, fontFamily:"'DM Sans',sans-serif", fontSize:13, background:'#FAF6EE', color:'#2A1A1A', outline:'none' }}/>
      </div>
      <button onClick={onLogin} style={{ width:'100%', background:'#6B1F1F', color:'#FAF6EE', border:'none', borderRadius:6, padding:'13px', fontFamily:"'DM Sans',sans-serif", fontSize:14, fontWeight:500, cursor:'pointer', letterSpacing:'.04em' }}>Sign in →</button>
      <div style={{ textAlign:'center', marginTop:16, fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#8A7A6A' }}>Forgot password? Contact the school office.</div>
    </div>
  </div>
);

/* ── APP ── */
const App = () => {
  const [screen, setScreen] = useState('dashboard');
  const [loggedIn, setLoggedIn] = useState(false);
  const [showPrint, setShowPrint] = useState(false);

  if (!loggedIn) return <LoginScreen onLogin={()=>setLoggedIn(true)}/>;

  const [title, subtitle] = TITLES[screen] || ['LMS',''];

  const renderScreen = () => {
    switch(screen) {
      case 'dashboard': return <DashboardScreen onNav={setScreen}/>;
      case 'quran':     return <QuranScreen/>;
      case 'lessons':   return <LessonsScreen/>;
      case 'reports':   return <ReportsScreen onGenerate={()=>setShowPrint(true)}/>;
      case 'messages':  return <MessagesScreen/>;
      default: return <div style={{ padding:40, color:'#8A7A6A', fontFamily:"'DM Sans',sans-serif", fontSize:14 }}>Navigate using the sidebar.</div>;
    }
  };

  return (
    <>
      <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
        <Sidebar active={screen} onNav={s=>{ setScreen(s); setShowPrint(false); }}/>
        <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
          <TopBar title={title} subtitle={subtitle}/>
          <div style={{ flex:1, overflow:'hidden', background:'#F2EBDB' }}>
            {renderScreen()}
          </div>
        </div>
      </div>
      {showPrint && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.5)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:300 }}>
          <div style={{ background:'white', borderRadius:12, padding:32, width:400, textAlign:'center', boxShadow:'0 40px 80px rgba(0,0,0,.3)' }}>
            <div style={{ width:56, height:56, borderRadius:'50%', background:'#E8F5EC', margin:'0 auto 16px', display:'flex', alignItems:'center', justifyContent:'center' }}>
              <svg width={24} height={24} viewBox="0 0 24 24" fill="none" stroke="#3A6B45" strokeWidth="2.5"><path d="M20 6L9 17l-5-5"/></svg>
            </div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:24, fontWeight:600, color:'#4A1313', marginBottom:8 }}>12 report cards generated</div>
            <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:13, color:'#5A4A4A', marginBottom:20 }}>PDFs ready. WhatsApp to all parents? Digital signatures applied.</p>
            <div style={{ display:'flex', gap:10 }}>
              <button style={{ flex:1, background:'#6B1F1F', color:'#FAF6EE', border:'none', borderRadius:6, padding:'11px', fontFamily:"'DM Sans',sans-serif", fontSize:13, cursor:'pointer' }}>Send via WhatsApp →</button>
              <button onClick={()=>setShowPrint(false)} style={{ flex:1, background:'transparent', border:'1px solid #D9CDB5', borderRadius:6, padding:'11px', fontFamily:"'DM Sans',sans-serif", fontSize:13, color:'#5A4A4A', cursor:'pointer' }}>Download ZIPs</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
