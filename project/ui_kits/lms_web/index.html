<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body { font-family: 'DM Sans', sans-serif; background: #FAF6EE; color: #2A1A1A; overflow: hidden; }

/* ── Responsive overrides ── */
@media (max-width: 900px) {
  /* Sidebar collapses to icons-only at 72px */
  body { overflow: auto; }
  #root { overflow: auto; }
}
@media (max-width: 680px) {
  /* Full-screen layout: sidebar hidden, top bar nav */
  body { overflow: auto; }
}

/* Touch-friendly sidebar nav items */
@media (max-width: 900px) {
  .lms-sidebar-item { min-height: 44px !important; padding: 10px 8px !important; }
  .lms-main { padding: 16px !important; }
  .lms-dash-grid { grid-template-columns: repeat(2, 1fr) !important; }
  .lms-att-grid { grid-template-columns: repeat(3, 1fr) !important; }
}
@media (max-width: 600px) {
  .lms-layout { flex-direction: column !important; }
  .lms-sidebar { width: 100% !important; height: auto !important; flex-direction: row !important; overflow-x: auto !important; border-right: none !important; border-bottom: 1px solid rgba(201,169,97,.2) !important; }
  .lms-sidebar-item { flex-direction: column !important; gap: 4px !important; font-size: 9px !important; min-width: 64px !important; text-align: center !important; }
  .lms-main { min-height: 0 !important; overflow-y: auto !important; }
  .lms-dash-grid { grid-template-columns: 1fr 1fr !important; }
  .lms-att-grid { grid-template-columns: repeat(2, 1fr) !important; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ── DATA ── */

  { id:1, name:'Zainab Fatima',   initials:'ZF', grade:'3A', roll:'07', status:'present', note:'', photo: null },

  { id:11,name:'Hira Aziz',       initials:'HA', grade:'3A', roll:'04', status:'present', note:'', photo: null },

  { name:'Ahmad Mirza',   grade:'3A', amount:'PKR 8,500', due:'10 May', status:'overdue' },

  { name:'Hamza Khalid',  grade:'3A', amount:'PKR 8,500', due:'10 May', status:'pending' },
  { name:'Fatima Noor',   grade:'3A', amount:'PKR 8,500', due:'10 May', status:'paid' },

/* ── ICONS ── */
const Icon = ({ d, size=16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
    <path d={d}/>
  </svg>
);
const icons = {
  dashboard: "M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z M9 22V12h6v10",
  attendance: "M9 11l3 3L22 4 M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11",
  notes: "M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8",
  students: "M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2 M9 3a4 4 0 110 8 4 4 0 010-8z M23 21v-2a4 4 0 00-3-3.87 M16 3.13a4 4 0 010 7.75",
  fees: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z M12 6v6l4 2",
  lessons: "M4 19.5A2.5 2.5 0 016.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z",
  quran: "M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z",
  reports: "M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z",
  messages: "M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z",
  logout: "M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4 M16 17l5-5-5-5 M21 12H9",
  bell: "M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9 M13.73 21a2 2 0 01-3.46 0",
  search: "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0",
  ai: "M12 2a10 10 0 110 20A10 10 0 0112 2z M8 12h8 M12 8v8",
  check: "M20 6L9 17l-5-5",
  x: "M18 6L6 18 M6 6l12 12",
  clock: "M12 2a10 10 0 110 20A10 10 0 0112 2z M12 6v6l4 2",
  whatsapp: "M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z",
};

/* ── COLOUR HELPERS ── */
const statusBadge = (s) => {
  const map = {
    present: { bg:'#E8F5EC', color:'#3A6B45', label:'Present' },
    absent:  { bg:'#FAEAEA', color:'#8B1F1F', label:'Absent' },
    late:    { bg:'#FEF6E0', color:'#8B6A1F', label:'Late' },
    paid:    { bg:'#E8F5EC', color:'#2D6A4F', label:'Paid' },
    overdue: { bg:'#FAEAEA', color:'#8B1F1F', label:'Overdue' },
    pending: { bg:'#FEF6E0', color:'#8B6A1F', label:'Pending' },
  };
  return map[s] || { bg:'#F0F0F4', color:'#5A5A6A', label: s };
};

const avatarColor = (initials) => {
  const colors = ['#E8D9B5','#D4E8D9','#D9E0F0','#F0DDD9','#E0D9F0'];
  return colors[(initials.charCodeAt(0) + initials.charCodeAt(1)) % colors.length];
};

/* ── COMPONENTS ── */
const Avatar = ({ initials, size=40 }) => (
  <div style={{
    width:size, height:size, borderRadius:'50%',
    background: avatarColor(initials),
    display:'flex', alignItems:'center', justifyContent:'center',
    fontFamily:"'Cormorant Garamond',serif", fontSize: size*0.38,
    fontWeight:600, color:'#4A1313', flexShrink:0,
    border:'2px solid #FAF6EE',
  }}>{initials}</div>
);

const Badge = ({ status }) => {
  const { bg, color, label } = statusBadge(status);
  return (
    <span style={{
      background:bg, color, padding:'3px 9px', borderRadius:999,
      fontSize:11, fontWeight:500, fontFamily:"'DM Sans',sans-serif",
      whiteSpace:'nowrap',
    }}>{label}</span>
  );
};

const Sidebar = ({ active, onNav }) => {
  const items = [
    { key:'dashboard',  label:'Dashboard',    icon:icons.dashboard },
    { key:'attendance', label:'Attendance',   icon:icons.attendance },
    { key:'notes',      label:'Daily Notes',  icon:icons.notes,    badge:3 },
    { key:'students',   label:'My Class',     icon:icons.students },
    { key:'lessons',    label:'Lesson Plans', icon:icons.lessons },
    { key:'quran',      label:'Quran Tracker',icon:icons.quran },
    { key:'fees',       label:'Fees',         icon:icons.fees },
    { key:'reports',    label:'Reports',      icon:icons.reports },
    { key:'messages',   label:'Messages',     icon:icons.messages, badge:2 },
  ];
  return (
    <div style={{
      width:230, background:'#4A1313', display:'flex', flexDirection:'column',
      flexShrink:0, height:'100%',
    }}>
      {/* Logo */}
      <div style={{ padding:'20px 18px 16px', borderBottom:'1px solid rgba(201,169,97,.2)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <img src="../../assets/logo-photo.png" alt="Good Day School" style={{ width:42, height:42, objectFit:'contain', flexShrink:0, filter:'drop-shadow(0 2px 4px rgba(0,0,0,.3))' }}/>
          <div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:15, fontWeight:600, color:'#E8D9B5', lineHeight:1.1 }}>Good Day School</div>
            <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:9, letterSpacing:'.14em', textTransform:'uppercase', color:'#C9A961', opacity:.8, marginTop:2 }}>Teacher Portal</div>
          </div>
        </div>
      </div>

      {/* Nav items */}
      <div style={{ flex:1, overflowY:'auto', padding:'8px 0' }}>
        <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:9, letterSpacing:'.18em', textTransform:'uppercase', color:'#C9A961', opacity:.6, padding:'10px 18px 4px' }}>Classroom</div>
        {items.slice(0,5).map(it => (
          <NavItem key={it.key} item={it} active={active===it.key} onClick={()=>onNav(it.key)}/>
        ))}
        <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:9, letterSpacing:'.18em', textTransform:'uppercase', color:'#C9A961', opacity:.6, padding:'12px 18px 4px' }}>Admin</div>
        {items.slice(5).map(it => (
          <NavItem key={it.key} item={it} active={active===it.key} onClick={()=>onNav(it.key)}/>
        ))}
      </div>

      {/* User */}
      <div style={{ borderTop:'1px solid rgba(201,169,97,.2)', padding:'14px 18px', display:'flex', alignItems:'center', gap:10 }}>
        <Avatar initials="NH" size={32}/>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:12, fontWeight:500, color:'#E8D9B5', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>Ms. Nadia Habib</div>
          <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, color:'#C9A961', opacity:.8 }}>Grade 3A Teacher</div>
        </div>
        <div style={{ color:'#C9A961', opacity:.7, cursor:'pointer' }}>
          <Icon d={icons.logout} size={15}/>
        </div>
      </div>
    </div>
  );
};

const NavItem = ({ item, active, onClick }) => (
  <div onClick={onClick} style={{
    display:'flex', alignItems:'center', gap:10, padding:'9px 18px',
    fontFamily:"'DM Sans',sans-serif", fontSize:13,
    color: active ? '#C9A961' : '#E8D9B5',
    background: active ? 'rgba(201,169,97,.12)' : 'transparent',
    borderRight: active ? '2px solid #C9A961' : '2px solid transparent',
    cursor:'pointer', transition:'all .2s', userSelect:'none',
  }}
    onMouseEnter={e=>{ if(!active){ e.currentTarget.style.background='rgba(255,255,255,.06)'; e.currentTarget.style.color='#FAF6EE'; }}}
    onMouseLeave={e=>{ if(!active){ e.currentTarget.style.background='transparent'; e.currentTarget.style.color='#E8D9B5'; }}}
  >
    <svg width={15} height={15} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <path d={item.icon}/>
    </svg>
    <span style={{ flex:1 }}>{item.label}</span>
    {item.badge && (
      <span style={{ background:'#6B1F1F', color:'#E8D9B5', width:18, height:18, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', fontSize:9, fontWeight:700 }}>{item.badge}</span>
    )}
  </div>
);

const TopBar = ({ title, subtitle }) => (
  <div style={{
    background:'#FAF6EE', borderBottom:'1px solid #D9CDB5',
    padding:'14px 28px', display:'flex', alignItems:'center', justifyContent:'space-between',
    flexShrink:0,
  }}>
    <div>
      <h1 style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:26, fontWeight:600, color:'#4A1313', lineHeight:1 }}>{title}</h1>
      {subtitle && <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:12, color:'#8A7A6A', marginTop:3 }}>{subtitle}</div>}
    </div>
    <div style={{ display:'flex', alignItems:'center', gap:14 }}>
      <div style={{ position:'relative' }}>
        <svg style={{ position:'absolute', left:10, top:'50%', transform:'translateY(-50%)', width:14, height:14 }} viewBox="0 0 24 24" fill="none" stroke="#8A7A6A" strokeWidth="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input placeholder="Search…" style={{ background:'#F2EBDB', border:'1px solid #D9CDB5', borderRadius:6, padding:'7px 12px 7px 32px', fontFamily:"'DM Sans',sans-serif", fontSize:13, color:'#2A1A1A', outline:'none', width:180 }}/>
      </div>
      <div style={{ position:'relative', cursor:'pointer', color:'#5A4A4A' }}>
        <Icon d={icons.bell} size={18}/>
        <span style={{ position:'absolute', top:-4, right:-4, background:'#6B1F1F', color:'white', width:14, height:14, borderRadius:'50%', fontSize:8, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center' }}>3</span>
      </div>
      <Avatar initials="NH" size={32}/>
    </div>

/* ── SCREENS ── */
const DashboardScreen = ({ onNav }) => {
  const present = STUDENTS.filter(s=>s.status==='present').length;
  const absent  = STUDENTS.filter(s=>s.status==='absent').length;
  const late    = STUDENTS.filter(s=>s.status==='late').length;

  const StatCard = ({ label, value, sub, color='#4A1313', bg='white' }) => (
    <div style={{ background:bg, border:'1px solid #D9CDB5', borderRadius:10, padding:'20px 22px' }}>
      <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, letterSpacing:'.14em', textTransform:'uppercase', color:'#8A7A6A', marginBottom:8 }}>{label}</div>
      <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:36, fontWeight:600, color, lineHeight:1 }}>{value}</div>
      {sub && <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#8A7A6A', marginTop:6 }}>{sub}</div>}
    </div>
  );

  return (
    <div style={{ padding:'28px', overflowY:'auto', height:'100%' }}>
      {/* Stats */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:16, marginBottom:28 }}>
        <StatCard label="Present today"  value={present} sub="of 12 students" color="#3A6B45"/>
        <StatCard label="Absent today"   value={absent}  sub="Parent notified" color="#8B1F1F"/>
        <StatCard label="Late arrivals"  value={late}    sub="WhatsApp sent" color="#8B6A1F"/>
        <StatCard label="Notes pending"  value="9"       sub="Due by 3 PM" color="#6B1F1F"/>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'1.4fr 1fr', gap:20 }}>
        {/* Today's class */}
        <div style={{ background:'white', border:'1px solid #D9CDB5', borderRadius:10, overflow:'hidden' }}>
          <div style={{ background:'#6B1F1F', padding:'14px 20px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:18, fontWeight:600, color:'#FAF6EE' }}>Grade 3A · Today</span>
            <span onClick={()=>onNav('attendance')} style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#C9A961', cursor:'pointer', letterSpacing:'.08em' }}>View all →</span>
          </div>
          <div style={{ padding:'14px 20px' }}>
            {STUDENTS.slice(0,6).map(s=>(
              <div key={s.id} style={{ display:'flex', alignItems:'center', gap:12, padding:'9px 0', borderBottom:'1px solid #F2EBDB' }}>
                <Avatar initials={s.initials} size={34}/>
                <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:13, color:'#2A1A1A', flex:1 }}>{s.name}</span>
                <Badge status={s.status}/>
              </div>
            ))}
          </div>
        </div>

        {/* Alerts + Quick actions */}
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <div style={{ background:'white', border:'1px solid #D9CDB5', borderRadius:10, overflow:'hidden', flex:1 }}>
            <div style={{ padding:'14px 18px', borderBottom:'1px solid #D9CDB5' }}>
              <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:18, fontWeight:600, color:'#4A1313' }}>Activity</span>
            </div>
            {ANNOUNCEMENTS.map(a=>(
              <div key={a.id} style={{ padding:'11px 18px', borderBottom:'1px solid #F2EBDB', display:'flex', gap:10, alignItems:'flex-start' }}>
                <div style={{ width:8, height:8, borderRadius:'50%', background: a.type==='fee'?'#8B1F1F': a.type==='absent'?'#8B6A1F':'#3A6B45', marginTop:5, flexShrink:0 }}></div>
                <div>
                  <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:12, color:'#2A1A1A' }}>{a.msg}</div>
                  <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, color:'#8A7A6A', marginTop:2 }}>{a.time}</div>
                </div>
              </div>
            ))}
          </div>

          <div style={{ background:'#4A1313', borderRadius:10, padding:'18px 20px' }}>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:16, color:'#E8D9B5', marginBottom:12 }}>Quick actions</div>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {[['Take attendance →', ()=>onNav('attendance')], ['Write daily notes →', ()=>onNav('notes')], ['View lesson plan →', ()=>onNav('lessons')]].map(([label, fn])=>(
                <button key={label} onClick={fn} style={{
                  background:'rgba(201,169,97,.12)', border:'1px solid rgba(201,169,97,.25)',
                  borderRadius:6, padding:'9px 14px', fontFamily:"'DM Sans',sans-serif",
                  fontSize:12, color:'#C9A961', cursor:'pointer', textAlign:'left',
                  transition:'background .2s',
                }} onMouseEnter={e=>e.target.style.background='rgba(201,169,97,.22)'}
                   onMouseLeave={e=>e.target.style.background='rgba(201,169,97,.12)'}
                >{label}</button>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

const AttendanceScreen = () => {
  const [students, setStudents] = useState(STUDENTS);
  const [saved, setSaved] = useState(false);

  const cycle = (id) => {
    const order = ['present','absent','late'];
    setStudents(prev => prev.map(s => s.id===id ? { ...s, status: order[(order.indexOf(s.status)+1)%order.length] } : s));
    setSaved(false);
  };

  const statusColor = (s) => ({ present:'#E8F5EC', absent:'#FAEAEA', late:'#FEF6E0' }[s]);
  const statusBorder = (s) => ({ present:'#3A6B45', absent:'#8B1F1F', late:'#8B6A1F' }[s]);

  return (
    <div style={{ padding:'24px 28px', overflowY:'auto', height:'100%' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
        <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:13, color:'#5A4A4A' }}>
          Tap a student to cycle: <Badge status="present"/> → <Badge status="absent"/> → <Badge status="late"/>
        </div>
        <div style={{ display:'flex', gap:10 }}>
          <div style={{ display:'flex', gap:8, alignItems:'center', fontFamily:"'DM Sans',sans-serif", fontSize:12, color:'#5A4A4A' }}>
            <span style={{ background:'#E8F5EC', color:'#3A6B45', padding:'3px 9px', borderRadius:999, fontSize:11, fontWeight:500 }}>{students.filter(s=>s.status==='present').length} Present</span>
            <span style={{ background:'#FAEAEA', color:'#8B1F1F', padding:'3px 9px', borderRadius:999, fontSize:11, fontWeight:500 }}>{students.filter(s=>s.status==='absent').length} Absent</span>
            <span style={{ background:'#FEF6E0', color:'#8B6A1F', padding:'3px 9px', borderRadius:999, fontSize:11, fontWeight:500 }}>{students.filter(s=>s.status==='late').length} Late</span>
          </div>

  const dayLabels = { Mon:'Mon 28', Tue:'Tue 29', Wed:'Wed 30', Thu:'Thu 1', Fri:'Fri 2' };
  const today = 'Mon'; // for "Today" indicator

  const subjectsByKey = Object.fromEntries(SUBJECTS.map(s=>[s.key,s]));
  const lesson = LESSONS[active];
  const subj = lesson ? subjectsByKey[lesson.subject] : null;

  return (
    <div style={{ height:'100%', overflowY:'auto', background:'#FAF6EE' }}>

            {['KG-A','KG-B','1A','1B','2A','3A','3B','4A','5A'].map(g=><option key={g}>{g}</option>)}
          </select>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <button onClick={()=>setWeek(w=>Math.max(1,w-1))} style={{ border:'1px solid #D9CDB5', background:'white', borderRadius:6, width:30, height:30, cursor:'pointer', color:'#6B1F1F', fontSize:14 }}>‹</button>
          <div style={{ background:'#F2EBDB', border:'1px solid #D9CDB5', borderRadius:6, padding:'5px 14px', minWidth:200, textAlign:'center' }}>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:15, fontWeight:600, color:'#4A1313', lineHeight:1.1 }}>Week {week} · 28 Apr – 2 May</div>
            <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, color:'#8A7A6A', marginTop:1 }}>Term 3 · 2025–26</div>
          </div>
          <button onClick={()=>setWeek(w=>Math.min(36,w+1))} style={{ border:'1px solid #D9CDB5', background:'white', borderRadius:6, width:30, height:30, cursor:'pointer', color:'#6B1F1F', fontSize:14 }}>›</button>

        <div style={{ display:'flex', background:'#F2EBDB', border:'1px solid #D9CDB5', borderRadius:6, padding:3 }}>

          ))}
        </div>
        <div style={{ flex:1 }}></div>
        <button style={{ background:'rgba(201,169,97,.15)', border:'1px solid #C9A961', color:'#6B1F1F', padding:'7px 14px', borderRadius:6, fontFamily:"'DM Sans',sans-serif", fontSize:12, fontWeight:500, cursor:'pointer' }}>+ Add lesson</button>
        <button style={{ background:'#6B1F1F', color:'#FAF6EE', border:'none', padding:'7px 14px', borderRadius:6, fontFamily:"'DM Sans',sans-serif", fontSize:12, fontWeight:500, cursor:'pointer' }}>Send to Head Teacher</button>

                  days.map(d=>{
                    const subjKey = WEEK_PLAN[d][pi];
                    const s = subjectsByKey[subjKey];
                    const cellKey = `${d}-${pi}`;
                    const ls = LESSONS[cellKey];
                    const isActive = cellKey===active;
                    return (
                      <div key={d} onClick={()=>setActive(cellKey)} style={{

                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
                    <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:9, letterSpacing:'.16em', textTransform:'uppercase', color:'rgba(255,255,255,.7)' }}>{subj.name} · {active.replace('-',' · P')}</span>
                    <span style={{ background:STATUS_STYLE[lesson.status].bg, color:STATUS_STYLE[lesson.status].color, padding:'2px 9px', borderRadius:999, fontSize:10, fontWeight:600, fontFamily:"'DM Sans',sans-serif" }}>{STATUS_STYLE[lesson.status].label}</span>

                  <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:18, fontWeight:600, lineHeight:1.25 }}>{lesson.topic}</div>
                  <div style={{ fontFamily:"'Lora',serif", fontSize:13, opacity:.85, marginTop:2, direction:'rtl', textAlign:'right' }}>{lesson.topicUr}</div>
                </div>
                <div style={{ padding:'14px 16px', maxHeight:580, overflowY:'auto' }}>
                  <DetailBlock label="Learning objectives">
                    <ul style={{ listStyle:'none', padding:0, margin:0 }}>
                      {lesson.objectives.map((o,i)=>(
                        <li key={i} style={{ display:'flex', gap:8, padding:'4px 0', fontFamily:"'Lora',serif", fontSize:12, color:'#2A1A1A', lineHeight:1.5 }}>
                          <span style={{ color:subj.color, fontWeight:700, flexShrink:0 }}>{i+1}.</span>
                          <span>{o}</span>
                        </li>
                      ))}
                    </ul>
                  </DetailBlock>
                  <DetailBlock label="Resources">
                    <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
                      {lesson.resources.map((r,i)=>(
                        <div key={i} style={{ display:'flex', gap:6, alignItems:'center', fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#2A1A1A' }}>
                          <span style={{ color:'#C9A961' }}>◆</span>{r}
                        </div>
                      ))}
                    </div>
                  </DetailBlock>
                  {lesson.homework && (
                    <DetailBlock label="Homework">
                      <p style={{ fontFamily:"'Lora',serif", fontSize:12, color:'#2A1A1A', lineHeight:1.55 }}>{lesson.homework}</p>
                    </DetailBlock>
                  )}
                  <DetailBlock label="Assessment">
                    <p style={{ fontFamily:"'Lora',serif", fontSize:12, color:'#2A1A1A', lineHeight:1.55 }}>{lesson.assessment}</p>
                  </DetailBlock>
                  {lesson.notes && (
                    <DetailBlock label="Teacher's note · post-class">
                      <div style={{ background:'#FAF6EE', border:'1px solid #D9CDB5', borderRadius:6, padding:'10px 12px', fontFamily:"'Lora',serif", fontSize:12, color:'#2A1A1A', lineHeight:1.55 }}>{lesson.notes}</div>
                    </DetailBlock>
                  )}
                  {!lesson.notes && lesson.status==='planned' && (
                    <DetailBlock label="Teacher's note · post-class">
                      <textarea placeholder="Add a note after the lesson — what worked, who needs follow-up…" style={{ width:'100%', minHeight:60, border:'1px solid #D9CDB5', borderRadius:6, padding:'8px 10px', fontFamily:"'Lora',serif", fontSize:12, color:'#2A1A1A', background:'#FAF6EE', resize:'vertical', outline:'none' }}/>
                    </DetailBlock>
                  )}
                  <div style={{ display:'flex', gap:6, marginTop:12 }}>
                    <button style={{ flex:1, background:subj.color, color:'#FAF6EE', border:'none', padding:'8px', borderRadius:6, fontFamily:"'DM Sans',sans-serif", fontSize:11, fontWeight:500, cursor:'pointer' }}>Edit lesson</button>
                    <button style={{ flex:1, background:'white', color:'#5A4A4A', border:'1px solid #D9CDB5', padding:'8px', borderRadius:6, fontFamily:"'DM Sans',sans-serif", fontSize:11, fontWeight:500, cursor:'pointer' }}>Duplicate</button>
                    <button title="AI suggest" style={{ background:'#C9A961', color:'#4A1313', border:'none', padding:'8px 10px', borderRadius:6, fontFamily:"'DM Sans',sans-serif", fontSize:11, fontWeight:600, cursor:'pointer' }}>✦ AI</button>
                  </div>
                </div>
              </div>
            ) : (
              <div style={{ background:'white', border:'1px dashed #D9CDB5', borderRadius:10, padding:'32px 16px', textAlign:'center', color:'#8A7A6A', fontFamily:"'Lora',serif", fontSize:13 }}>
                Select a lesson from the grid to view objectives and notes.
              </div>
            )}
          </div>
        </div>
      ) : (
        <TermOverview subjectsByKey={subjectsByKey}/>
      )}
    </div>
  );
};

/* ── APP ── */
const App = () => {
  const [screen, setScreen] = useState('lessons');
  const [selectedStudent, setSelectedStudent] = useState(null);
  const [loggedIn, setLoggedIn] = useState(false);

  if (!loggedIn) return <LoginScreen onLogin={()=>setLoggedIn(true)}/>;

  const [title, subtitle] = SCREEN_TITLES[screen] || ['LMS',''];
  const isProfile = screen==='students' && selectedStudent;

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
      <Sidebar active={screen} onNav={(s)=>{ setScreen(s); setSelectedStudent(null); }}/>
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
        <TopBar title={isProfile ? selectedStudent.name : title} subtitle={isProfile ? `Grade ${selectedStudent.grade} · Roll ${selectedStudent.roll}` : subtitle}/>
        <div style={{ flex:1, overflow:'hidden' }}>
          {screen==='dashboard'  && <DashboardScreen onNav={setScreen}/>}
          {screen==='attendance' && <AttendanceScreen/>}
          {screen==='notes'      && <NotesScreen/>}
          {screen==='fees'       && <FeesScreen/>}
          {screen==='lessons'    && <LessonsScreen/>}
          {screen==='students'   && !selectedStudent && <StudentsScreen onSelect={setSelectedStudent}/>}
          {screen==='students'   && selectedStudent  && <StudentProfileScreen student={selectedStudent} onBack={()=>setSelectedStudent(null)}/>}
          {!['dashboard','attendance','notes','fees','students','lessons'].includes(screen) && (
            <div style={{ padding:40, color:'#8A7A6A', fontFamily:"'DM Sans',sans-serif", fontSize:14 }}>
              Screen coming soon — navigate using the sidebar.
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

          <img src="../../assets/logo-photo.png" alt="Good Day School" style={{ width:84, height:84, objectFit:'contain', margin:'0 auto 16px', display:'block' }}/>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:26, fontWeight:600, color:'#4A1313' }}>Good Day School</div>
          <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, letterSpacing:'.18em', textTransform:'uppercase', color:'#8A7A6A', marginTop:4 }}>Teacher Portal</div>
        </div>
        <div style={{ marginBottom:14 }}>
          <label style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, letterSpacing:'.14em', textTransform:'uppercase', color:'#5A4A4A', display:'block', marginBottom:5 }}>Email address</label>
          <input defaultValue="nadia.habib@gooddayschool.pk" style={{ width:'100%', padding:'11px 13px', border:'1px solid #D9CDB5', borderRadius:6, fontFamily:"'DM Sans',sans-serif", fontSize:13, background:'#FAF6EE', color:'#2A1A1A', outline:'none' }}/>
        </div>
        <div style={{ marginBottom:24 }}>
          <label style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, letterSpacing:'.14em', textTransform:'uppercase', color:'#5A4A4A', display:'block', marginBottom:5 }}>Password</label>
          <input type="password" placeholder="••••••••" value={pw} onChange={e=>setPw(e.target.value)} style={{ width:'100%', padding:'11px 13px', border:'1px solid #D9CDB5', borderRadius:6, fontFamily:"'DM Sans',sans-serif", fontSize:13, background:'#FAF6EE', color:'#2A1A1A', outline:'none' }}/>
        </div>
        <button onClick={onLogin} style={{ width:'100%', background:'#6B1F1F', color:'#FAF6EE', border:'none', borderRadius:6, padding:'13px', fontFamily:"'DM Sans',sans-serif", fontSize:14, fontWeight:500, cursor:'pointer', letterSpacing:'.04em' }}>
          Sign in to portal →
        </button>
        <div style={{ textAlign:'center', marginTop:16, fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#8A7A6A' }}>
          Forgot password? Contact the school office.
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
