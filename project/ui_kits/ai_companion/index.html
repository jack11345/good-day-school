/* ════════════════════════════════════════════════
   SYSTEM PROMPT BUILDER
   ════════════════════════════════════════════════ */
function buildSystemPrompt(grade, subject, hintMode) {
  const topics = CURRICULUM[grade]?.[subject] || ['General learning'];
  return `You are Ustaz (meaning "teacher" in Urdu/Arabic), an AI learning assistant at Good Day School, Rawalpindi, Pakistan.
You help students in Grade ${grade} with ${SUBJECT_LABELS[subject]}.

CURRICULUM TOPICS FOR THIS SESSION:
${topics.map((t, i) => `${i+1}. ${t}`).join('\n')}

STRICT RULES — NEVER BREAK THESE:
1. ONLY discuss these curriculum topics: ${topics.join(', ')}
2. If asked ANYTHING outside these topics, say EXACTLY: "That is not in our lesson today! Let's stay focused — can you ask me something about ${topics[0]}?"
3. Use simple, friendly language suitable for a ${parseInt(grade) + 5}-year-old child. Short sentences. No difficult words.
4. ${hintMode ? 'HINT MODE IS ON: For all homework or exercise questions, give HINTS only — NEVER the direct answer. Say things like "Try thinking about..." or "Remember when we learned..." or "What happens if you...?" This is very important!' : 'You may give clear, helpful answers to questions.'}
5. Sprinkle in simple Urdu encouragement naturally: "Shabash! (Well done!)", "Bahut acha! (Very good!)", "Koshish karo! (Keep trying!)", "Masha'Allah!", "Wah wah!"
6. NEVER discuss: news, current events, politics, violence, other schools, social media, video games, celebrities, or anything outside the school curriculum.
7. Keep responses SHORT and friendly: maximum 3 sentences for a child. Do not write long paragraphs.
8. If you are not sure about something: say "Let's ask your teacher about that — they will know best, insha'Allah!"
9. Always end your response with a friendly follow-up question to keep the student thinking and engaged.
10. You are warm, encouraging, and patient like a kind teacher.`;
}

/* ════════════════════════════════════════════════
   AI CALL FUNCTION (Ollama → Anthropic → Offline)
   ════════════════════════════════════════════════ */
async function callAI(messages, grade, subject, hintMode, apiKey, ollamaModel, ollamaUrl) {
  const system = buildSystemPrompt(grade, subject, hintMode);
  const recentMessages = messages.slice(-6);

  // Try Ollama first
  try {
    const r = await fetch(`${ollamaUrl}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: ollamaModel || 'llama3.2:1b',
        stream: false,
        messages: [{ role: 'system', content: system }, ...recentMessages],
      }),
      signal: AbortSignal.timeout(15000),
    });
    if (r.ok) {
      const d = await r.json();
      return { text: d.message?.content || 'I did not understand that. Can you try again?', mode: 'ollama' };
    }
  } catch (e) { /* Ollama unavailable */ }

  // Fallback: Anthropic Haiku
  if (apiKey && apiKey.trim().startsWith('sk-ant')) {
    try {
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey.trim(),
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 300,
          system,
          messages: recentMessages,
        }),
        signal: AbortSignal.timeout(20000),
      });
      const d = await r.json();
      if (d.content && d.content[0]) {
        return { text: d.content[0].text, mode: 'anthropic' };
      }
    } catch (e) { /* Anthropic unavailable */ }
  }

  // Offline fallback
  const offline = [
    'That is a great question! I am not connected right now — please ask your teacher when you see them.',
    'I cannot answer just now. Write your question down and ask Ms. Nadia tomorrow — she will know!',
    'My connection is off today. Try again later, or ask a classmate to help you think about it!',
    'Oops! I cannot reach my brain right now. Koshish karo! (Keep trying!) — talk to your teacher.',
  ];
  return { text: offline[Math.floor(Math.random() * offline.length)], mode: 'offline' };
}

const SettingsDrawer = ({ open, onClose, settings, onSave }) => {
  const [local, setLocal] = useState(settings);
  const [testing, setTesting] = useState(false);
  const [testResult, setTestResult] = useState(null);

  useEffect(() => { setLocal(settings); }, [settings]);

  const set = (k, v) => setLocal(p => ({ ...p, [k]: v }));

  const testConnection = async () => {
    setTesting(true); setTestResult(null);
    try {
      const r = await fetch(`${local.ollamaUrl}/api/tags`, { signal: AbortSignal.timeout(4000) });
      if (r.ok) {
        const d = await r.json();
        const models = d.models?.map(m => m.name) || [];
        setTestResult({ ok: true, msg: `Ollama connected! ${models.length} model(s) found.` });
      } else { setTestResult({ ok: false, msg: 'Ollama responded with an error.' }); }
    } catch {
      if (local.apiKey?.trim().startsWith('sk-ant')) {
        setTestResult({ ok: true, msg: 'Ollama not found — will use Anthropic Haiku.' });
      } else {
        setTestResult({ ok: false, msg: 'Cannot connect. Check Ollama is running or add an API key.' });
      }
    }
    setTesting(false);
  };

  if (!open) return null;

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 500, display: 'flex' }}>
      <div onClick={onClose} style={{ flex: 1, background: 'rgba(42,26,26,.4)', backdropFilter: 'blur(4px)' }}/>

            {[['local','Local (Ollama)','Free, runs on your laptop. No internet needed in class.'],['cloud','Cloud (Anthropic Haiku)','Requires API key. Uses internet. Fast & smart.'],['demo','Demo (offline)','No AI connection. Uses offline fallback messages.']].map(([v,l,desc])=>(

              Ollama is free and runs on your laptop. Download from <strong>ollama.com</strong> — no internet needed during class. Then run: <code style={{ background: 'rgba(0,0,0,.06)', padding: '1px 5px', borderRadius: 3 }}>ollama pull llama3.2:1b</code>

          <div style={{ background: 'white', borderRadius: 12, border: '1px solid var(--line)', padding: 16 }}>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, letterSpacing: '.16em', textTransform: 'uppercase', color: 'var(--muted)', marginBottom: 12 }}>Anthropic API Key</div>

            </div>
            <div>
              <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: 'var(--ink-soft)', display: 'block', marginBottom: 5 }}>Date</label>
              <input type="date" value={local.date} onChange={e=>set('date',e.target.value)}

        </div>

        {/* Save */}

        </div>
      </div>

const TopicBanner = ({ grade, subject }) => {
  const topics = CURRICULUM[grade]?.[subject] || [];
  const color = SUBJECT_COLORS[subject] || 'var(--maroon-mid)';
  return (
    <div style={{
      background: `${color}12`, borderBottom: `2px solid ${color}30`,
      padding: '8px 16px', display: 'flex', alignItems: 'center', gap: 8, overflowX: 'auto',
    }}>
      <Icon name="book" size={13} color={color} strokeWidth={2}/>
      <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, color, fontWeight: 600, letterSpacing: '.1em', textTransform: 'uppercase', whiteSpace: 'nowrap' }}>
        Grade {grade} · {SUBJECT_LABELS[subject]}
      </span>
      <span style={{ color: '#D9CDB5' }}>·</span>
      {topics.slice(0, 3).map((t, i) => (
        <span key={i} style={{
          background: `${color}18`, color, padding: '2px 8px', borderRadius: 999,
          fontSize: 10, fontFamily: "'DM Sans', sans-serif", whiteSpace: 'nowrap', fontWeight: 500,
        }}>{t}</span>
      ))}
      {topics.length > 3 && <span style={{ fontSize: 10, color, fontFamily: "'DM Sans', sans-serif", whiteSpace: 'nowrap' }}>+{topics.length - 3} more</span>}
    </div>
  );
};

/* ════════════════════════════════════════════════
   STUDENT CHAT PANE
   ════════════════════════════════════════════════ */
const StudentPane = ({ studentName, grade, subject, setGrade, setSubject, messages, onSend, isTyping, hintMode, setHintMode, aiMode }) => {
  const [input, setInput] = useState('');
  const bottomRef = useRef(null);
  const MAX_CHARS = 200;

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, isTyping]);

  const handleSend = () => {
    const text = input.trim();
    if (!text) return;
    onSend(text);
    setInput('');
  };

  const greeting = (() => {
    const h = new Date().getHours();
    if (h < 12) return 'Assalamualaikum';
    if (h < 17) return 'Assalamualaikum';
    return 'Assalamualaikum';
  })();

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: 'var(--cream)' }}>
      {/* Greeting banner */}
      <div style={{ background: 'linear-gradient(135deg, var(--maroon-deep) 0%, var(--maroon-mid) 100%)', padding: '16px 20px 12px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
          <StarAvatar size={40}/>
          <div>
            <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 18, fontWeight: 600, color: 'var(--cream)', lineHeight: 1.1 }}>
              {greeting}, {studentName}!
            </div>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: 'var(--gold)', marginTop: 2 }}>
              I am Ustaz — your learning helper
            </div>
          </div>
          {/* Hint mode toggle */}
          <button onClick={() => setHintMode(h => !h)} style={{
            marginLeft: 'auto', background: hintMode ? 'rgba(201,169,97,.25)' : 'rgba(255,255,255,.1)',
            border: `1.5px solid ${hintMode ? 'var(--gold)' : 'rgba(255,255,255,.2)'}`,
            borderRadius: 20, padding: '5px 10px', cursor: 'pointer',
            display: 'flex', alignItems: 'center', gap: 5, flexShrink: 0,
          }}>
            <Icon name="lightbulb" size={13} color={hintMode ? 'var(--gold)' : 'rgba(255,255,255,.6)'}/>
            <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, color: hintMode ? 'var(--gold)' : 'rgba(255,255,255,.6)', fontWeight: 600 }}>
              {hintMode ? 'Hint mode ON' : 'Hint mode'}
            </span>
          </button>
        </div>

        {/* Grade + Subject selectors */}
        <div style={{ display: 'flex', gap: 8 }}>
          <div style={{ display: 'flex', background: 'rgba(255,255,255,.1)', borderRadius: 8, padding: 2, gap: 1 }}>
            {['1','2','3','4','5'].map(g => (
              <button key={g} onClick={() => setGrade(g)} style={{
                padding: '5px 10px', borderRadius: 6, border: 'none', cursor: 'pointer',
                background: grade === g ? 'var(--gold)' : 'transparent',
                color: grade === g ? 'var(--maroon-deep)' : 'rgba(255,255,255,.7)',
                fontFamily: "'DM Sans', sans-serif", fontSize: 12, fontWeight: grade === g ? 700 : 400,
                transition: 'all .15s',
              }}>G{g}</button>
            ))}
          </div>
          <select value={subject} onChange={e => setSubject(e.target.value)} style={{
            flex: 1, background: 'rgba(255,255,255,.12)', border: '1px solid rgba(255,255,255,.2)',
            borderRadius: 8, padding: '6px 10px', color: 'var(--cream)',
            fontFamily: "'DM Sans', sans-serif", fontSize: 12, outline: 'none', cursor: 'pointer',
          }}>
            {SUBJECTS.map(s => <option key={s} value={s} style={{ color: 'var(--ink)', background: 'white' }}>{SUBJECT_LABELS[s]}</option>)}
          </select>
        </div>
      </div>

      {/* Topic banner */}
      <TopicBanner grade={grade} subject={subject}/>

      {/* Chat messages */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '16px', display: 'flex', flexDirection: 'column' }}>
        {messages.length === 0 && (
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: 20 }}>
            <StarAvatar size={56}/>
            <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 20, fontWeight: 600, color: 'var(--maroon-mid)', marginTop: 14, marginBottom: 6 }}>
              Ready to learn!
            </div>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: 'var(--muted)', lineHeight: 1.6, maxWidth: 260 }}>
              Ask me anything about <strong>{SUBJECT_LABELS[subject]}</strong> for Grade {grade}. I am here to help!
            </div>
            <div style={{ marginTop: 16, display: 'flex', flexDirection: 'column', gap: 6, width: '100%', maxWidth: 260 }}>
              {(CURRICULUM[grade]?.[subject] || []).slice(0, 3).map((t, i) => (
                <button key={i} onClick={() => onSend(`Tell me about ${t}`)} style={{
                  background: 'white', border: '1.5px solid var(--line)', borderRadius: 20,
                  padding: '8px 14px', fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: 'var(--ink-soft)',
                  cursor: 'pointer', textAlign: 'left', transition: 'all .15s',
                }}>
                  Ask about: {t}
                </button>
              ))}
            </div>
          </div>
        )}

        {messages.map((msg, i) => (
          <div key={i} className="msg-enter" style={{
            display: 'flex', alignItems: 'flex-end', gap: 8, marginBottom: 12,
            flexDirection: msg.role === 'user' ? 'row-reverse' : 'row',
          }}>
            {msg.role === 'assistant' ? <StarAvatar size={32}/> : <StudentAvatar name={studentName} size={32}/>}
            <div style={{
              maxWidth: '75%',
              background: msg.role === 'user'
                ? 'linear-gradient(135deg, var(--maroon-mid) 0%, var(--maroon-deep) 100%)'
                : 'white',
              color: msg.role === 'user' ? 'var(--cream)' : 'var(--ink)',
              borderRadius: msg.role === 'user' ? '16px 4px 16px 16px' : '4px 16px 16px 16px',
              padding: '10px 14px',
              border: msg.role === 'assistant' ? '1.5px solid var(--line)' : 'none',
              boxShadow: '0 2px 8px rgba(74,19,19,.08)',
              position: 'relative',
            }}>
              <p style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 14, lineHeight: 1.55 }}>{msg.content}</p>
              {msg.mode && msg.role === 'assistant' && (
                <div style={{ marginTop: 6, display: 'flex', alignItems: 'center', gap: 4 }}>
                  {msg.mode === 'offline' && (
                    <span style={{ display: 'flex', alignItems: 'center', gap: 3, fontFamily: "'DM Sans', sans-serif", fontSize: 9, color: '#8A7A6A' }}>
                      <Icon name="alert" size={9} color="#C9A961" strokeWidth={2.5}/>
                      offline
                    </span>
                  )}
                  <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 9, color: '#B0A898', marginLeft: 'auto' }}>
                    {new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                  </span>
                </div>
              )}
            </div>
          </div>
        ))}

        {isTyping && <TypingIndicator/>}
        <div ref={bottomRef}/>
      </div>

      {/* Input area */}
      <div style={{ borderTop: '1.5px solid var(--line)', padding: '12px 16px', background: 'white' }}>
        {hintMode && (
          <div style={{ background: 'rgba(201,169,97,.12)', borderRadius: 6, padding: '5px 10px', marginBottom: 8, display: 'flex', alignItems: 'center', gap: 5 }}>
            <Icon name="lightbulb" size={11} color="var(--gold)" strokeWidth={2.5}/>
            <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, color: '#8B6A1F' }}>Hint mode — I will guide you, not give answers!</span>
          </div>
        )}
        <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end' }}>
          <div style={{ flex: 1, position: 'relative' }}>
            <textarea
              value={input}
              onChange={e => setInput(e.target.value.slice(0, MAX_CHARS))}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
              placeholder={`Ask about ${SUBJECT_LABELS[subject]}...`}
              rows={1}
              style={{
                width: '100%', border: '1.5px solid var(--line)', borderRadius: 12,
                padding: '11px 14px', fontFamily: "'DM Sans', sans-serif", fontSize: 14,
                outline: 'none', resize: 'none', background: 'var(--cream)', lineHeight: 1.4,
                minHeight: 44, maxHeight: 100, overflow: 'auto',
              }}
            />
            <div style={{ position: 'absolute', bottom: 6, right: 10, fontFamily: "'DM Sans', sans-serif", fontSize: 9, color: input.length > 160 ? '#8B1F1F' : 'var(--muted)' }}>
              {input.length}/{MAX_CHARS}
            </div>
          </div>
          <button
            onClick={handleSend}
            disabled={!input.trim()}
            style={{
              width: 44, height: 44, borderRadius: 12, border: 'none',
              background: input.trim() ? 'linear-gradient(135deg, var(--maroon-mid) 0%, var(--maroon-deep) 100%)' : 'var(--line)',
              color: 'white', cursor: input.trim() ? 'pointer' : 'not-allowed',
              display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
              transition: 'all .2s', boxShadow: input.trim() ? '0 2px 8px rgba(107,31,31,.3)' : 'none',
            }}
          >
            <Icon name="send" size={17} color="white" strokeWidth={2.5}/>
          </button>
        </div>
      </div>
    </div>
  );
};

/* ════════════════════════════════════════════════
   TEACHER VIEW PANE
   ════════════════════════════════════════════════ */
const TeacherPane = ({ sessions, grade, subject }) => {
  const [expandedId, setExpandedId] = useState(null);
  const [filterSubject, setFilterSubject] = useState('all');

  const filtered = filterSubject === 'all' ? sessions : sessions.filter(s => s.subject === filterSubject);

  // Coverage: count unique topics covered per subject
  const coverage = {};
  sessions.forEach(s => {
    const key = s.subject;
    if (!coverage[key]) coverage[key] = new Set();
    s.messages.filter(m => m.role === 'user').forEach(m => {
      (CURRICULUM[s.grade]?.[s.subject] || []).forEach(t => {
        if (m.content.toLowerCase().includes(t.toLowerCase().split(' ')[0])) {
          coverage[key].add(t);
        }
      });
    });
  });

  const downloadCSV = () => {
    alert('CSV download ready!\n\n(In production this would generate a CSV file with all conversation logs, student names, subjects, and timestamps for the teacher\'s records.)');
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: 'var(--cream-deep)' }}>
      {/* Header */}
      <div style={{ background: 'var(--maroon-deep)', padding: '16px 20px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
          <div>
            <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 18, fontWeight: 600, color: 'var(--cream)' }}>Teacher View</div>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: 'var(--gold)', marginTop: 1 }}>
              {sessions.length} session{sessions.length !== 1 ? 's' : ''} today
            </div>
          </div>
          <button onClick={downloadCSV} style={{
            background: 'rgba(201,169,97,.2)', border: '1px solid rgba(201,169,97,.4)',
            borderRadius: 8, padding: '7px 12px', cursor: 'pointer',
            display: 'flex', alignItems: 'center', gap: 5, color: 'var(--gold)',
            fontFamily: "'DM Sans', sans-serif", fontSize: 11, fontWeight: 600,
          }}>
            <Icon name="download" size={13} color="var(--gold)" strokeWidth={2.5}/>
            CSV
          </button>
        </div>

        {/* Subject filter */}
        <div style={{ display: 'flex', gap: 4, overflowX: 'auto', paddingBottom: 2 }}>
          <button onClick={() => setFilterSubject('all')} style={{ padding: '4px 10px', borderRadius: 999, border: 'none', cursor: 'pointer', background: filterSubject==='all'?'var(--gold)':'rgba(255,255,255,.1)', color: filterSubject==='all'?'var(--maroon-deep)':'rgba(255,255,255,.7)', fontFamily: "'DM Sans', sans-serif", fontSize: 10, fontWeight: 600, whiteSpace: 'nowrap', flexShrink: 0 }}>All</button>
          {SUBJECTS.map(s => (
            <button key={s} onClick={() => setFilterSubject(s)} style={{ padding: '4px 10px', borderRadius: 999, border: 'none', cursor: 'pointer', background: filterSubject===s?'var(--gold)':'rgba(255,255,255,.1)', color: filterSubject===s?'var(--maroon-deep)':'rgba(255,255,255,.7)', fontFamily: "'DM Sans', sans-serif", fontSize: 10, fontWeight: 600, whiteSpace: 'nowrap', flexShrink: 0 }}>{SUBJECT_LABELS[s]}</button>
          ))}
        </div>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: 16 }}>

        {/* Curriculum coverage chart */}
        <div style={{ background: 'white', borderRadius: 12, border: '1px solid var(--line)', padding: 16, marginBottom: 16 }}>
          <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, letterSpacing: '.16em', textTransform: 'uppercase', color: 'var(--muted)', marginBottom: 12 }}>
            Curriculum Coverage Today
          </div>
          {SUBJECTS.map(s => {
            const total = (CURRICULUM[grade]?.[s] || []).length;
            const covered = coverage[s]?.size || 0;
            const pct = total > 0 ? Math.round((covered / total) * 100) : 0;
            const color = SUBJECT_COLORS[s] || 'var(--maroon-mid)';
            return (
              <div key={s} style={{ marginBottom: 10 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                  <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: 'var(--ink-soft)' }}>{SUBJECT_LABELS[s]}</span>
                  <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, color: 'var(--muted)' }}>{covered}/{total} topics</span>
                </div>
                <div style={{ height: 6, background: '#F2EBDB', borderRadius: 99, overflow: 'hidden' }}>
                  <div style={{ height: '100%', width: `${pct}%`, background: color, borderRadius: 99, transition: 'width .4s ease' }}/>
                </div>
              </div>
            );
          })}
        </div>

        {/* Sessions list */}
        {sessions.length === 0 ? (
          <div style={{ textAlign: 'center', padding: 32, color: 'var(--muted)' }}>
            <Icon name="users" size={32} color="var(--line)" strokeWidth={1.5}/>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, marginTop: 10 }}>No sessions yet today.</div>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, marginTop: 4 }}>Students will appear here when they start chatting.</div>
          </div>
        ) : filtered.map(session => {
          const hasOffline = session.messages.some(m => m.mode === 'offline');
          const isExpanded = expandedId === session.id;
          return (
            <div key={session.id} style={{
              background: 'white', borderRadius: 12, border: `1.5px solid ${hasOffline ? '#F0C060' : 'var(--line)'}`,
              marginBottom: 10, overflow: 'hidden',
              boxShadow: '0 2px 8px rgba(74,19,19,.05)',
            }}>
              <button onClick={() => setExpandedId(isExpanded ? null : session.id)} style={{
                width: '100%', background: 'none', border: 'none', padding: '12px 14px',
                display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', textAlign: 'left',
              }}>
                <StudentAvatar name={session.studentName} size={36}/>
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, fontWeight: 600, color: 'var(--ink)' }}>{session.studentName}</span>
                    {hasOffline && (
                      <span style={{ display: 'flex', alignItems: 'center', gap: 3, background: '#FEF6E0', border: '1px solid #F0C060', borderRadius: 999, padding: '1px 7px' }}>
                        <Icon name="flag" size={9} color="#B8861F" strokeWidth={2.5}/>
                        <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 9, color: '#8B6A1F', fontWeight: 600 }}>FLAGGED</span>
                      </span>
                    )}
                  </div>
                  <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, color: 'var(--muted)', marginTop: 2 }}>
                    Grade {session.grade} · {SUBJECT_LABELS[session.subject]} · {session.messages.length} messages
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, color: 'var(--muted)' }}>
                    {session.lastActive}
                  </span>
                  <Icon name="chevron_right" size={14} color="var(--muted)" strokeWidth={2}/>
                </div>
              </button>

              {isExpanded && (
                <div style={{ borderTop: '1px solid var(--line)', padding: '12px 14px', background: 'var(--cream)' }}>
                  {session.messages.map((m, i) => (
                    <div key={i} style={{ marginBottom: 8, display: 'flex', gap: 8, flexDirection: m.role === 'user' ? 'row-reverse' : 'row', alignItems: 'flex-start' }}>
                      {m.role === 'assistant' ? <StarAvatar size={22}/> : <StudentAvatar name={session.studentName} size={22}/>}
                      <div style={{
                        maxWidth: '80%',
                        background: m.role === 'user' ? 'var(--maroon-mid)' : 'white',
                        color: m.role === 'user' ? 'white' : 'var(--ink)',
                        border: m.role === 'assistant' ? '1px solid var(--line)' : 'none',
                        borderRadius: m.role === 'user' ? '10px 2px 10px 10px' : '2px 10px 10px 10px',
                        padding: '7px 10px',
                      }}>
                        <p style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, lineHeight: 1.4 }}>{m.content}</p>
                        {m.mode === 'offline' && (
                          <span style={{ fontSize: 9, color: '#C9A961', display: 'block', marginTop: 3 }}>⚠ offline response</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* ════════════════════════════════════════════════
   MAIN APP
   ════════════════════════════════════════════════ */
const App = () => {
  const [activeTab, setActiveTab] = useState('student'); // 'student' | 'teacher'
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [grade, setGrade] = useState('3');
  const [subject, setSubject] = useState('english');
  const [studentName, setStudentName] = useState('Zainab');
  const [hintMode, setHintMode] = useState(false);
  const [messages, setMessages] = useState([]);
  const [isTyping, setIsTyping] = useState(false);
  const [aiMode, setAiMode] = useState('unknown');
  const [showMobileTeacher, setShowMobileTeacher] = useState(false);

  const [settings, setSettings] = useState({
    mode: 'local',
    ollamaUrl: 'http://localhost:11434',
    ollamaModel: 'llama3.2:1b',
    apiKey: '',
    section: '3A',
    date: new Date().toISOString().split('T')[0],
  });

  // Demo sessions for teacher view
  const [sessions, setSessions] = useState([
    {
      id: 1, studentName: 'Ahmed', grade: '3', subject: 'math',
      lastActive: '9:14 AM',
      messages: [
        { role: 'user', content: 'What is multiplication?' },
        { role: 'assistant', content: 'Shabash! Great question! Multiplication is like adding the same number many times. For example, 3 × 4 means adding 3 four times: 3 + 3 + 3 + 3 = 12. Can you try 2 × 5 for me?', mode: 'ollama' },
        { role: 'user', content: '2 times 5 is 10!' },
        { role: 'assistant', content: 'Bahut acha! You got it! 2 × 5 = 10, masha\'Allah! Now can you try 3 × 3?', mode: 'ollama' },
      ],
    },
    {
      id: 2, studentName: 'Fatima', grade: '3', subject: 'science',
      lastActive: '9:31 AM',
      messages: [
        { role: 'user', content: 'What are states of matter?' },
        { role: 'assistant', content: 'I am not connected right now — please ask your teacher when you see them.', mode: 'offline' },
      ],
    },
    {
      id: 3, studentName: 'Omar', grade: '3', subject: 'english',
      lastActive: '9:45 AM',
      messages: [
        { role: 'user', content: 'Tell me about community helpers' },
        { role: 'assistant', content: 'Community helpers are people who help us every day! Doctors keep us healthy, teachers help us learn, and police officers keep us safe. Who is your favourite community helper?', mode: 'anthropic' },
        { role: 'user', content: 'I like doctors' },
        { role: 'assistant', content: 'Wah wah! Doctors are so important! They went to school for many years to learn how to help sick people. Would you like to learn what doctors use to check your heartbeat?', mode: 'anthropic' },
      ],
    },
  ]);

  const handleSend = useCallback(async (text) => {
    const newMsg = { role: 'user', content: text };
    setMessages(prev => [...prev, newMsg]);
    setIsTyping(true);

    const allMessages = [...messages, newMsg];
    const result = await callAI(
      allMessages.map(m => ({ role: m.role, content: m.content })),
      grade, subject, hintMode, settings.apiKey, settings.ollamaModel, settings.ollamaUrl
    );

    setAiMode(result.mode);
    const aiMsg = { role: 'assistant', content: result.text, mode: result.mode };
    setMessages(prev => [...prev, aiMsg]);
    setIsTyping(false);

    // Record session for teacher view
    setSessions(prev => {
      const sessionId = `live-${studentName}`;
      const existing = prev.find(s => s.id === sessionId);
      if (existing) {
        return prev.map(s => s.id === sessionId ? {
          ...s, subject, grade,
          messages: [...allMessages, aiMsg].map(m => ({ ...m })),
          lastActive: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        } : s);
      }
      return [{
        id: sessionId, studentName, grade, subject,
        lastActive: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        messages: [...allMessages, aiMsg].map(m => ({ ...m })),
      }, ...prev];
    });
  }, [messages, grade, subject, hintMode, settings, studentName]);

  // Reset messages when grade/subject changes
  useEffect(() => { setMessages([]); }, [grade, subject]);

  return (
    <div style={{ minHeight: '100vh', background: 'var(--cream-deep)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0' }}>
      <div className="app-container" style={{
        width: '100%', maxWidth: 1100, height: '100vh', maxHeight: 800,
        background: 'var(--cream)', borderRadius: 20,
        boxShadow: '0 32px 64px rgba(74,19,19,.18), 0 0 0 1px rgba(74,19,19,.08)',
        display: 'flex', flexDirection: 'column', overflow: 'hidden',
      }}>

        {/* ── HEADER ── */}
        <div style={{
          background: 'linear-gradient(135deg, var(--maroon-deep) 0%, #3A0F0F 100%)',
          padding: '0 20px', display: 'flex', alignItems: 'center', gap: 12,
          height: 60, flexShrink: 0, borderBottom: '2px solid rgba(201,169,97,.2)',
        }}>
          {/* Logo */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginRight: 4 }}>
            <div style={{ width: 32, height: 32, borderRadius: 8, background: 'rgba(201,169,97,.15)', border: '1px solid rgba(201,169,97,.3)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <svg width={18} height={18} viewBox="0 0 24 24" fill="none" stroke="var(--gold)" strokeWidth="1.8">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
              </svg>
            </div>
            <div>
              <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 15, fontWeight: 600, color: 'var(--cream)', lineHeight: 1 }}>Good Day School</div>
              <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 9, color: 'var(--gold)', letterSpacing: '.12em', textTransform: 'uppercase' }}>Ustaz AI · Rawalpindi</div>
            </div>
          </div>

          {/* Tab toggle */}
          <div style={{ display: 'flex', background: 'rgba(255,255,255,.08)', borderRadius: 8, padding: 2, gap: 1, marginLeft: 8 }}>
            {[['student','Student'],['teacher','Teacher']].map(([t,l]) => (
              <button key={t} onClick={() => setActiveTab(t)} style={{
                padding: '5px 14px', borderRadius: 6, border: 'none', cursor: 'pointer',
                background: activeTab===t ? 'var(--gold)' : 'transparent',
                color: activeTab===t ? 'var(--maroon-deep)' : 'rgba(255,255,255,.65)',
                fontFamily: "'DM Sans', sans-serif", fontSize: 12, fontWeight: activeTab===t ? 700 : 500,
                transition: 'all .2s',
              }}>{l}</button>
            ))}
          </div>

          {/* Student name selector */}
          <select value={studentName} onChange={e => setStudentName(e.target.value)} style={{
            background: 'rgba(255,255,255,.1)', border: '1px solid rgba(255,255,255,.2)',
            borderRadius: 8, padding: '6px 10px', color: 'var(--cream)',
            fontFamily: "'DM Sans', sans-serif", fontSize: 12, outline: 'none', cursor: 'pointer',
          }}>
            {STUDENTS.map(s => <option key={s} value={s} style={{ color: 'var(--ink)', background: 'white' }}>{s}</option>)}
          </select>

          {/* Spacer */}
          <div style={{ flex: 1 }}/>

          {/* Connection badge */}
          <ConnectionBadge mode={aiMode}/>

          {/* Mobile teacher toggle */}
          <button onClick={() => setShowMobileTeacher(true)} style={{
            display: 'none', background: 'rgba(201,169,97,.15)', border: '1px solid rgba(201,169,97,.3)',
            borderRadius: 8, padding: '6px 10px', cursor: 'pointer', color: 'var(--gold)',
            fontFamily: "'DM Sans', sans-serif", fontSize: 11,
          }} className="mobile-teacher-btn">
            Teacher
          </button>

          {/* Settings */}
          <button onClick={() => setSettingsOpen(true)} style={{
            background: 'rgba(255,255,255,.08)', border: '1px solid rgba(255,255,255,.15)',
            borderRadius: 8, padding: '7px', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
            transition: 'background .2s',
          }}>
            <Icon name="settings" size={17} color="var(--gold)"/>
          </button>
        </div>

        {/* ── SPLIT BODY ── */}
        <div className="split-layout" style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>

          {/* Student pane */}
          <div style={{
            flex: activeTab === 'student' ? 1 : '0 0 0',
            minWidth: activeTab === 'student' ? 0 : 0,
            overflow: 'hidden', transition: 'flex .3s ease',
            display: 'flex', flexDirection: 'column',
          }}>
            <StudentPane
              studentName={studentName}
              grade={grade} subject={subject}
              setGrade={g => { setGrade(g); }}
              setSubject={s => { setSubject(s); }}
              messages={messages}
              onSend={handleSend}
              isTyping={isTyping}
              hintMode={hintMode}
              setHintMode={setHintMode}
              aiMode={aiMode}
            />
          </div>

          {/* Divider */}
          <div style={{
            width: activeTab === 'teacher' ? 0 : 1, background: 'var(--line)', flexShrink: 0,
            transition: 'width .3s',
          }}/>

          {/* Teacher pane (always rendered, toggled via tabs on mobile, shown as right column on desktop) */}
          <div style={{
            width: activeTab === 'teacher' ? '100%' : 340, flexShrink: 0,
            overflow: 'hidden', display: 'flex', flexDirection: 'column',
            transition: 'width .3s ease',
          }}>
            <TeacherPane sessions={sessions} grade={grade} subject={subject}/>
          </div>
        </div>

      </div>

      {/* Settings drawer */}
      <SettingsDrawer
        open={settingsOpen}
        onClose={() => setSettingsOpen(false)}
        settings={settings}
        onSave={s => { setSettings(s); setAiMode('unknown'); }}
      />
    </div>
  );
};

/* ════════════════════════════════════════════════
   ADDITIONAL RESPONSIVE CSS
   ════════════════════════════════════════════════ */
const responsiveStyle = document.createElement('style');
responsiveStyle.textContent = `
  @media (max-width: 900px) {
    .split-layout > div:last-child { width: 0 !important; overflow: hidden; }
    .app-container { max-width: 100% !important; border-radius: 0 !important; max-height: 100dvh !important; }
  }
  @media (min-width: 901px) {
    .split-layout > div:first-child { flex: 1 !important; }
    .split-layout > div:last-child { width: 340px !important; }
  }
`;
document.head.appendChild(responsiveStyle);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
