<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Good Day School — Driver App</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #1A1010; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 32px; padding: 24px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const STOPS = [
  { id:1, area:'Satellite Town', address:'Block D, Street 4', students:[{name:'Zainab Fatima',initials:'ZF'},{name:'Hamza Khalid',initials:'HK'}], status:'done' },
  { id:2, area:'Chaklala', address:'Scheme 3, Near Masjid', students:[{name:'Ahmad Mirza',initials:'AM'}], status:'done' },
  { id:3, area:'Rawalpindi Cantt', address:'Tench Bhatta Road', students:[{name:'Sara Iqbal',initials:'SI'},{name:'Maryam Baig',initials:'MB'},{name:'Hira Aziz',initials:'HA'}], status:'current' },
  { id:4, area:'Lalazar Colony', address:'Street 12, Near Park', students:[{name:'Ali Hassan',initials:'AH'},{name:'Bilal Shahid',initials:'BS'}], status:'upcoming' },
  { id:5, area:'Chaur Chowk', address:'Opposite Bank', students:[{name:'Aisha Rehman',initials:'AR'},{name:'Umar Farooq',initials:'UF'}], status:'upcoming' },
  { id:6, area:'Dhoke Ratta', address:'Main Murree Road', students:[{name:'Fatima Noor',initials:'FN'},{name:'Saud Mehmood',initials:'SM'}], status:'upcoming' },
];

const CHECKLIST = [
  'Brakes checked and responsive',
  'Fuel level sufficient for route',
  'Tyres — all four checked',
  'First-aid kit in place',
  'Fire extinguisher present',
  'All seatbelts functional',
  'Side mirrors adjusted',
  'Emergency contact list on dashboard',
];

const Avatar = ({ initials, size=40, bg='#E8D9B5', color='#4A1313' }) => (
  <div style={{ width:size, height:size, borderRadius:'50%', background:bg, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:"'Cormorant Garamond',serif", fontSize:size*0.38, fontWeight:600, color, flexShrink:0 }}>{initials}</div>
);

const PhoneShell = ({ children, title }) => (
  <div style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
    {title && <div style={{ color:'#E8D9B5', fontFamily:"'DM Sans',sans-serif", fontSize:11, letterSpacing:'.14em', textTransform:'uppercase', marginBottom:12, opacity:.7 }}>{title}</div>}
    <div style={{ width:360, borderRadius:36, background:'#1A1010', boxShadow:'0 32px 64px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08)', overflow:'hidden' }}>
      <div style={{ background:'#4A1313', padding:'12px 20px 8px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:12, fontWeight:600, color:'#E8D9B5' }}>9:41</span>
        <div style={{ display:'flex', gap:5, alignItems:'center' }}>
          <svg width="14" height="10" viewBox="0 0 14 10" fill="#E8D9B5" opacity=".8"><rect x="0" y="3" width="2.5" height="7" rx="1"/><rect x="3.8" y="1.5" width="2.5" height="8.5" rx="1"/><rect x="7.6" y="0" width="2.5" height="10" rx="1"/><rect x="11.5" y="0" width="2.5" height="10" rx="1"/></svg>
          <svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="#E8D9B5" strokeWidth="1.3" opacity=".8"><path d="M7 2.5C5 2.5 3.2 3.3 1.8 4.6L0.5 3.3C2.3 1.6 4.5 0.5 7 0.5s4.7 1.1 6.5 2.8L12.2 4.6C10.8 3.3 9 2.5 7 2.5z"/><path d="M7 5.5C5.8 5.5 4.8 6 4.1 6.8L2.8 5.5C3.9 4.4 5.4 3.7 7 3.7s3.1.7 4.2 1.8L9.9 6.8C9.2 6 8.2 5.5 7 5.5z"/><circle cx="7" cy="9" r="1.2"/></svg>
          <svg width="20" height="10" viewBox="0 0 20 10" fill="#E8D9B5" opacity=".8"><rect x="0" y="0.5" width="16" height="9" rx="1.5" fill="none" stroke="#E8D9B5" strokeWidth="1"/><rect x="16.5" y="2.5" width="2" height="5" rx="1"/><rect x="1.5" y="2" width="11" height="6" rx="0.8"/></svg>
        </div>
      </div>
      <div style={{ height:640, overflowY:'auto', background:'#FAF6EE' }}>{children}</div>
    </div>
  </div>
);

/* ── SCREEN 1: Pre-trip checklist ── */
const ChecklistScreen = ({ onStart }) => {
  const [checked, setChecked] = useState({});
  const allDone = CHECKLIST.every((_,i) => checked[i]);

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      <div style={{ background:'#4A1313', padding:'16px 20px 20px' }}>
        <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#C9A961', letterSpacing:'.1em', marginBottom:4 }}>Before you start</div>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:24, fontWeight:600, color:'#FAF6EE' }}>Safety Checklist</div>
        <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#E8D9B5', opacity:.7, marginTop:2 }}>Route 4 · Morning run · 2 May 2026</div>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'16px' }}>
        <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#8A7A6A', marginBottom:12 }}>
          {Object.keys(checked).filter(k=>checked[k]).length} of {CHECKLIST.length} items checked
        </div>
        {CHECKLIST.map((item, i) => (
          <div key={i} onClick={() => setChecked(p=>({...p,[i]:!p[i]}))} style={{ display:'flex', alignItems:'center', gap:14, padding:'14px 16px', marginBottom:8, background:'white', borderRadius:10, border:`2px solid ${checked[i]?'#3A6B45':'#D9CDB5'}`, cursor:'pointer', transition:'all .2s' }}>
            <div style={{ width:26, height:26, borderRadius:'50%', border:`2px solid ${checked[i]?'#3A6B45':'#D9CDB5'}`, background:checked[i]?'#3A6B45':'transparent', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, transition:'all .2s' }}>
              {checked[i] && <svg width={13} height={13} viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M20 6L9 17l-5-5"/></svg>}
            </div>
            <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:14, color:checked[i]?'#3A6B45':'#2A1A1A', fontWeight:checked[i]?500:400 }}>{item}</span>
          </div>
        ))}
      </div>

      <div style={{ padding:'12px 16px 20px' }}>
        <button onClick={allDone ? onStart : null} style={{ width:'100%', background:allDone?'#3A6B45':'#D9CDB5', color:allDone?'white':'#8A7A6A', border:'none', borderRadius:12, padding:'16px', fontFamily:"'DM Sans',sans-serif", fontSize:15, fontWeight:600, cursor:allDone?'pointer':'not-allowed', transition:'background .3s' }}>
          {allDone ? 'Start Route →' : `Complete all ${CHECKLIST.length} items to start`}
        </button>
      </div>
    </div>
  );
};

/* ── SCREEN 2: Route in progress ── */
const RouteScreen = ({ onSOS }) => {
  const [stops, setStops] = useState(STOPS);
  const [expanded, setExpanded] = useState(3);

  const markStop = (stopId, studentName, action) => {
    setStops(prev => prev.map(s => s.id === stopId ? {
      ...s,
      students: s.students.map(st => st.name === studentName ? {...st, action} : st)
    } : s));
  };

  const completeStop = (stopId) => {
    setStops(prev => {
      const idx = prev.findIndex(s=>s.id===stopId);
      return prev.map((s,i) => i===idx ? {...s,status:'done'} : i===idx+1 ? {...s,status:'current'} : s);
    });
    setExpanded(stopId+1);
  };

  const done = stops.filter(s=>s.status==='done').length;
  const total = stops.length;

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      {/* Header */}
      <div style={{ background:'#4A1313', padding:'14px 20px 16px' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:10 }}>
          <div>
            <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#C9A961', letterSpacing:'.08em' }}>Route 4 · Morning</div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:22, fontWeight:600, color:'#FAF6EE' }}>Muhammad Asif</div>
          </div>
          <button onClick={onSOS} style={{ background:'#8B1F1F', color:'white', border:'none', borderRadius:10, padding:'10px 16px', fontFamily:"'DM Sans',sans-serif", fontSize:13, fontWeight:700, cursor:'pointer', letterSpacing:'.04em' }}>
            SOS
          </button>
        </div>
        {/* Progress bar */}
        <div style={{ background:'rgba(255,255,255,.1)', borderRadius:999, height:6 }}>
          <div style={{ background:'#C9A961', borderRadius:999, height:'100%', width:`${(done/total)*100}%`, transition:'width .4s' }}></div>
        </div>
        <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#E8D9B5', marginTop:6 }}>{done} of {total} stops · ETA school: 7:52 AM</div>
      </div>

      {/* Stop list */}
      <div style={{ flex:1, overflowY:'auto', background:'#F2EBDB', padding:'12px' }}>
        {stops.map(stop => {
          const isCurrent = stop.status === 'current';
          const isDone = stop.status === 'done';
          const isExpanded = expanded === stop.id;

          return (
            <div key={stop.id} onClick={()=>setExpanded(isExpanded?null:stop.id)} style={{
              background: isCurrent?'white':'white',
              border: `2px solid ${isCurrent?'#6B1F1F':isDone?'#3A6B45':'#D9CDB5'}`,
              borderRadius:12, marginBottom:10, overflow:'hidden',
              opacity: stop.status==='upcoming' && !isExpanded ? .7 : 1,
            }}>
              {/* Stop header */}
              <div style={{ padding:'14px 16px', display:'flex', alignItems:'center', gap:12 }}>
                <div style={{ width:32, height:32, borderRadius:'50%', background:isDone?'#E8F5EC':isCurrent?'#6B1F1F':'#F0F0F4', border:`2px solid ${isDone?'#3A6B45':isCurrent?'#6B1F1F':'#D9CDB5'}`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                  {isDone
                    ? <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke="#3A6B45" strokeWidth="3"><path d="M20 6L9 17l-5-5"/></svg>
                    : <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, fontWeight:700, color:isCurrent?'white':'#8A7A6A' }}>{stop.id}</span>
                  }
                </div>
                <div style={{ flex:1 }}>
                  <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:14, fontWeight:600, color:'#2A1A1A' }}>{stop.area}</div>
                  <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#8A7A6A' }}>{stop.address} · {stop.students.length} student{stop.students.length>1?'s':''}</div>
                </div>
                {isCurrent && <div style={{ background:'#FEF6E0', color:'#8B6A1F', padding:'3px 8px', borderRadius:999, fontFamily:"'DM Sans',sans-serif", fontSize:10, fontWeight:600 }}>Current</div>}
                {isDone && <div style={{ background:'#E8F5EC', color:'#3A6B45', padding:'3px 8px', borderRadius:999, fontFamily:"'DM Sans',sans-serif", fontSize:10, fontWeight:600 }}>Done</div>}
              </div>

              {/* Students (expanded) */}
              {isExpanded && (
                <div style={{ borderTop:'1px solid #F2EBDB' }}>
                  {stop.students.map(student => (
                    <div key={student.name} style={{ padding:'12px 16px', borderBottom:'1px solid #F2EBDB', display:'flex', alignItems:'center', gap:12 }}>
                      <Avatar initials={student.initials} size={40}/>
                      <div style={{ flex:1 }}>
                        <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:13, fontWeight:500, color:'#2A1A1A' }}>{student.name}</div>
                        {student.action && <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, color:student.action==='boarded'?'#3A6B45':'#8B1F1F', marginTop:2 }}>Marked: {student.action}</div>}
                      </div>
                      <div style={{ display:'flex', gap:8 }}>
                        <button onClick={e=>{e.stopPropagation();markStop(stop.id,student.name,'boarded');}} style={{ background: student.action==='boarded'?'#3A6B45':'#E8F5EC', color:student.action==='boarded'?'white':'#3A6B45', border:`1px solid #3A6B45`, borderRadius:8, padding:'8px 12px', fontFamily:"'DM Sans',sans-serif", fontSize:12, fontWeight:500, cursor:'pointer', minWidth:60, minHeight:44 }}>
                          Board
                        </button>
                        <button onClick={e=>{e.stopPropagation();markStop(stop.id,student.name,'absent');}} style={{ background:student.action==='absent'?'#8B1F1F':'#FAEAEA', color:student.action==='absent'?'white':'#8B1F1F', border:'1px solid #8B1F1F', borderRadius:8, padding:'8px 12px', fontFamily:"'DM Sans',sans-serif", fontSize:12, fontWeight:500, cursor:'pointer', minWidth:60, minHeight:44 }}>
                          Absent
                        </button>
                      </div>
                    </div>
                  ))}

                  {isCurrent && (
                    <div style={{ padding:'12px 16px' }}>
                      <button onClick={e=>{e.stopPropagation();completeStop(stop.id);}} style={{ width:'100%', background:'#6B1F1F', color:'white', border:'none', borderRadius:10, padding:'14px', fontFamily:"'DM Sans',sans-serif", fontSize:14, fontWeight:600, cursor:'pointer' }}>
                        Stop complete → Next stop
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}

        {/* Arrival at school */}
        {done === total && (
          <div style={{ background:'#4A1313', borderRadius:12, padding:'20px 16px', textAlign:'center' }}>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:20, color:'#FAF6EE', marginBottom:8 }}>All stops complete</div>
            <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:12, color:'#C9A961', marginBottom:16 }}>Arrived at school · 12 students on board</div>
            <button style={{ background:'#C9A961', color:'#4A1313', border:'none', borderRadius:10, padding:'13px 28px', fontFamily:"'DM Sans',sans-serif", fontSize:13, fontWeight:700, cursor:'pointer' }}>Mark arrival at school</button>
          </div>
        )}
      </div>
    </div>
  );
};

/* ── SCREEN 3: SOS ── */
const SOSScreen = ({ onBack }) => {
  const [called, setCalled] = useState(false);
  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%', background:'#8B1F1F' }}>
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:32, textAlign:'center' }}>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:28, fontWeight:600, color:'white', marginBottom:8 }}>Emergency</div>
        <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:13, color:'rgba(255,255,255,.8)', marginBottom:40 }}>Location sent automatically to school</div>

        <button onClick={()=>setCalled(true)} style={{ width:140, height:140, borderRadius:'50%', background:called?'#5A1010':'white', color:called?'white':'#8B1F1F', border:'none', fontFamily:"'DM Sans',sans-serif", fontSize:18, fontWeight:800, cursor:'pointer', boxShadow:called?'none':'0 0 0 12px rgba(255,255,255,.2), 0 0 0 24px rgba(255,255,255,.1)', transition:'all .3s', letterSpacing:'.08em' }}>
          {called ? 'CALLING…' : 'SOS'}
        </button>

        {called && (
          <div style={{ marginTop:32 }}>
            <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:14, color:'white', fontWeight:500 }}>Calling school admin…</div>
            <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:12, color:'rgba(255,255,255,.7)', marginTop:6 }}>+92 300 123 4567</div>
          </div>
        )}

        <div style={{ marginTop:40, display:'flex', flexDirection:'column', gap:12, width:'100%' }}>
          {[['Police emergency','15'],['Rescue','1122'],['School dispatch','+92 300 123 4567']].map(([l,n])=>(
            <div key={l} style={{ background:'rgba(255,255,255,.12)', borderRadius:10, padding:'13px 18px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:13, color:'white' }}>{l}</span>
              <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:13, fontWeight:700, color:'#FFD080' }}>{n}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{ padding:'12px 16px 20px' }}>
        <button onClick={onBack} style={{ width:'100%', background:'rgba(255,255,255,.15)', color:'white', border:'1px solid rgba(255,255,255,.3)', borderRadius:10, padding:'13px', fontFamily:"'DM Sans',sans-serif", fontSize:13, cursor:'pointer' }}>← Cancel</button>
      </div>
    </div>
  );
};

/* ── APP ── */
const App = () => {
  const [screen, setScreen] = useState('checklist');
  return (
    <div style={{ display:'flex', gap:32, flexWrap:'wrap', alignItems:'flex-start', justifyContent:'center' }}>
      <PhoneShell title="Pre-trip checklist">
        <ChecklistScreen onStart={()=>{}}/>
      </PhoneShell>
      <PhoneShell title="Route in progress">
        <RouteScreen onSOS={()=>{}}/>
      </PhoneShell>
      <PhoneShell title="SOS screen">
        <SOSScreen onBack={()=>{}}/>
      </PhoneShell>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
