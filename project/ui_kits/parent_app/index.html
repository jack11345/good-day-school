<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Good Day School — Parent App</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lora:wght@400;500&family=DM+Sans:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'DM Sans', sans-serif; transition: background .6s ease; }

/* Mood themes — drive every accent in the app via CSS vars */
body[data-mood="maroon"]   { background:#2A1A1A; --m-deep:#4A1313; --m-mid:#6B1F1F; --m-soft:#8B3434; --acc:#C9A961; --acc-soft:#E8D9B5; --cream:#FAF6EE; --cream-deep:#F2EBDB; --line:#D9CDB5; --ink:#2A1A1A; --ink-soft:#5A4A4A; --muted:#8A7A6A; }
body[data-mood="garden"]   { background:#1A2820; --m-deep:#1F3D2E; --m-mid:#2F5A45; --m-soft:#3F7758; --acc:#C9A961; --acc-soft:#E8DDB5; --cream:#F4F2E8; --cream-deep:#E8E5D5; --line:#CFCDB5; --ink:#1A1F18; --ink-soft:#46504A; --muted:#7A8478; }
body[data-mood="dusk"]     { background:#0E0F1F; --m-deep:#1A1F3D; --m-mid:#2A3358; --m-soft:#404976; --acc:#D49B5C; --acc-soft:#EBC79B; --cream:#F2EFE8; --cream-deep:#E2DED2; --line:#C5C0B0; --ink:#1A1A2A; --ink-soft:#4A4A5A; --muted:#7A7A8A; }

/* Form — corner radius scale across cards & buttons */
body[data-form="stone"]   { --r-card:4px;  --r-btn:3px;  --r-pill:6px;   --r-input:4px;  --r-phone:14px; }
body[data-form="paper"]   { --r-card:12px; --r-btn:8px;  --r-pill:999px; --r-input:8px;  --r-phone:36px; }
body[data-form="pillow"]  { --r-card:22px; --r-btn:16px; --r-pill:999px; --r-input:18px; --r-phone:46px; }

#root { min-height:100%; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 24px; flex-wrap: wrap; }

/* ─── Mood overrides ─── inline hex → palette swap via attribute selectors */
body[data-mood="garden"] [style*="#4A1313"]      { background-color:#1F3D2E !important; color:inherit; }
body[data-mood="garden"] [style*="#6B1F1F"]      { background-color:#2F5A45 !important; }
body[data-mood="garden"] [style*="#8B1F1F"]      { background-color:#3F7758 !important; color:#F4F2E8 !important; }
body[data-mood="garden"] [style*="color:#4A1313"]{ color:#1F3D2E !important; }
body[data-mood="garden"] [style*="color:#6B1F1F"]{ color:#2F5A45 !important; }
body[data-mood="garden"] [style*="color:#8B1F1F"]{ color:#8B3A1F !important; }
body[data-mood="garden"] [style*="border:2px solid #8B1F1F"]{ border-color:#8B3A1F !important; }
body[data-mood="garden"] [style*="background:#FAF6EE"]{ background-color:#F4F2E8 !important; }
body[data-mood="garden"] [style*="background:#F2EBDB"]{ background-color:#E8E5D5 !important; }
body[data-mood="garden"] [style*="#D9CDB5"]      { border-color:#CFCDB5 !important; }

body[data-mood="dusk"] [style*="#4A1313"]      { background-color:#1A1F3D !important; }
body[data-mood="dusk"] [style*="#6B1F1F"]      { background-color:#2A3358 !important; }
body[data-mood="dusk"] [style*="#8B1F1F"]      { background-color:#5A2F58 !important; color:#F2EFE8 !important; }
body[data-mood="dusk"] [style*="color:#4A1313"]{ color:#1A1F3D !important; }
body[data-mood="dusk"] [style*="color:#6B1F1F"]{ color:#2A3358 !important; }
body[data-mood="dusk"] [style*="color:#8B1F1F"]{ color:#A05A2F !important; }
body[data-mood="dusk"] [style*="#C9A961"]      { color:#D49B5C !important; }
body[data-mood="dusk"] [style*="background:rgba(201,169,97,.2"]{ background-color:rgba(212,155,92,.22) !important; }
body[data-mood="dusk"] [style*="background:rgba(201,169,97,.25"]{ background-color:rgba(212,155,92,.25) !important; }
body[data-mood="dusk"] [style*="background:#FAF6EE"]{ background-color:#F2EFE8 !important; }
body[data-mood="dusk"] [style*="background:#F2EBDB"]{ background-color:#E2DED2 !important; }

/* ─── Form (radius) overrides ─── */
body[data-form="stone"]  [style*="borderRadius:36"]{ border-radius:14px !important; }
body[data-form="stone"]  [style*="borderRadius:12"],
body[data-form="stone"]  [style*="borderRadius:10"]{ border-radius:4px !important; }
body[data-form="stone"]  [style*="borderRadius:8"] { border-radius:3px !important; }
body[data-form="stone"]  [style*="borderRadius:20"]{ border-radius:6px !important; }
body[data-form="stone"]  [style*="borderRadius:999"]{ border-radius:6px !important; }
body[data-form="stone"]  [style*="borderRadius:'50%'"]{ border-radius:6px !important; }

body[data-form="pillow"] [style*="borderRadius:36"]{ border-radius:46px !important; }
body[data-form="pillow"] [style*="borderRadius:12"],
body[data-form="pillow"] [style*="borderRadius:10"]{ border-radius:22px !important; }
body[data-form="pillow"] [style*="borderRadius:8"] { border-radius:16px !important; }
body[data-form="pillow"] [style*="borderRadius:20"]{ border-radius:28px !important; }

/* ─── Voice overrides ─── */
body[data-voice="urdu"]    .__en-only { display:none !important; }
body[data-voice="english"] .__ur-only { display:none !important; }
body[data-voice="urdu"]    [style*="Cormorant Garamond"]{ font-family:'Noto Nastaliq Urdu',serif !important; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

/* ── DATA ── */
const CHILDREN = [
  { id:1, name:'Zainab', nameUr:'زینب', grade:'Grade 3', section:'3A', roll:'07', initials:'ZF',
    status:'present', statusUr:'حاضر', feeBalance:0, feeDue:null,
    note:'Zainab completed her manzil revision independently today. Excellent tajweed on Surah Al-Mulk.',
    noteUr:'زینب نے آج اپنی منزل کی مراجعت خود مکمل کی۔ سورۃ الملک پر بہترین تجوید۔',
    homework:'Read pages 34–36 in Urdu reader', homeworkDue:'Mon 5 May',
    attendance:92,
  },
  { id:2, name:'Bilal', nameUr:'بلال', grade:'KG 2', section:'KG-B', roll:'03', initials:'BA',
    status:'absent', statusUr:'غیر حاضر', feeBalance:8500, feeDue:'10 May',
    note:'Bilal was missed today. Hope he feels better soon.',
    noteUr:'بلال آج غیر حاضر رہا۔ امید ہے جلد ٹھیک ہو جائے۔',
    homework:'', homeworkDue:'',
    attendance:78,
  },
];

const MESSAGES = [
  { from:'Ms. Nadia', role:'Class Teacher', time:'Today 2:30 PM', text:'Assalam u alaikum! Zainab had a wonderful day. She led the morning dua today. Well done!', unread:true },
  { from:'Accountant', role:'Fee Office', time:'Yesterday', text:'Your May invoice of PKR 8,500 is due on 10 May. Please pay via JazzCash or at the office.', unread:false },
  { from:'Dr. Sara', role:'School Nurse', time:'Mon 28 Apr', text:'Reminder: Zainab\'s annual vaccination check-in is scheduled for next Wednesday.', unread:false },
];

const FEES = [
  { month:'May 2026', amount:'PKR 8,500', due:'10 May 2026', status:'pending', items:['Tuition fee','Transport · Route 4'] },
  { month:'Apr 2026', amount:'PKR 8,500', due:'10 Apr 2026', status:'paid', items:['Tuition fee','Transport · Route 4'] },
  { month:'Mar 2026', amount:'PKR 9,200', due:'10 Mar 2026', status:'paid', items:['Tuition fee','Transport','Books bundle'] },
];

/* ── HELPERS ── */
const Avatar = ({ initials, size=40, bg='#E8D9B5', color='#4A1313' }) => (
  <div style={{
    width:size, height:size, borderRadius:'50%', background:bg,
    display:'flex', alignItems:'center', justifyContent:'center',
    fontFamily:"'Cormorant Garamond',serif", fontSize:size*0.38,
    fontWeight:600, color, flexShrink:0,
  }}>{initials}</div>
);

const Badge = ({ label, bg, color }) => (
  <span style={{ background:bg, color, padding:'3px 10px', borderRadius:999, fontSize:11, fontWeight:500, fontFamily:"'DM Sans',sans-serif" }}>{label}</span>
);

const statusStyle = (s) => ({
  present: { bg:'#E8F5EC', color:'#3A6B45' },
  absent:  { bg:'#FAEAEA', color:'#8B1F1F' },
  late:    { bg:'#FEF6E0', color:'#8B6A1F' },
}[s] || { bg:'#F0F0F4', color:'#5A5A6A' });

/* ── PHONE SHELL ── */
const PhoneShell = ({ children, title }) => (
  <div style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
    {title && <div style={{ color:'#E8D9B5', fontFamily:"'DM Sans',sans-serif", fontSize:11, letterSpacing:'.14em', textTransform:'uppercase', marginBottom:12, opacity:.7 }}>{title}</div>}
    <div style={{
      width:360, borderRadius:36, background:'#1A1010',
      boxShadow:'0 32px 64px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08)',
      overflow:'hidden', position:'relative',
    }}>
      {/* Status bar */}
      <div style={{ background:'#4A1313', padding:'12px 20px 8px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:12, fontWeight:600, color:'#E8D9B5' }}>9:41</span>
        <div style={{ display:'flex', gap:6, alignItems:'center' }}>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="#E8D9B5" opacity=".8"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="2" width="3" height="10" rx="1"/><rect x="9" y="1" width="3" height="11" rx="1"/><rect x="13.5" y="0" width="2.5" height="12" rx="1"/></svg>
          <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="#E8D9B5" strokeWidth="1.5" opacity=".8"><path d="M7.5 3C5 3 2.8 4 1.2 5.8L0 4.5C2 2.3 4.6 1 7.5 1s5.5 1.3 7.5 3.5L13.8 5.8C12.2 4 10 3 7.5 3z"/><path d="M7.5 6C6 6 4.7 6.7 3.8 7.8L2.5 6.5C3.8 5 5.5 4 7.5 4s3.7 1 5 2.5L11.2 7.8C10.3 6.7 9 6 7.5 6z"/><circle cx="7.5" cy="10" r="1.5"/></svg>
          <svg width="22" height="12" viewBox="0 0 22 12" fill="#E8D9B5" opacity=".8"><rect x="0" y="1" width="18" height="10" rx="2" fill="none" stroke="#E8D9B5" strokeWidth="1.2"/><rect x="18.5" y="3.5" width="2" height="5" rx="1"/><rect x="1.5" y="2.5" width="12" height="7" rx="1"/></svg>
        </div>
      </div>
      {/* Content */}
      <div style={{ height:620, overflowY:'auto', background:'#FAF6EE' }}>
        {children}
      </div>
    </div>
  </div>
);

/* ── BOTTOM NAV ── */
const BottomNav = ({ active, onNav, unread=0 }) => {
  const tabs = [
    { key:'home', label:'Home', icon:'M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z' },
    { key:'child', label:'Child', icon:'M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2 M9 3a4 4 0 110 8 4 4 0 010-8z' },
    { key:'fees', label:'Fees', icon:'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z M12 8v4l3 3' },
    { key:'messages', label:'Messages', icon:'M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z', badge:unread },
  ];
  return (
    <div style={{ display:'flex', background:'white', borderTop:'1px solid #D9CDB5', padding:'6px 0 12px' }}>
      {tabs.map(t=>(
        <button key={t.key} onClick={()=>onNav(t.key)} style={{
          flex:1, background:'none', border:'none', cursor:'pointer',
          display:'flex', flexDirection:'column', alignItems:'center', gap:3,
          padding:'6px 0', position:'relative',
        }}>
          <div style={{ position:'relative' }}>
            <svg width={20} height={20} viewBox="0 0 24 24" fill="none"
              stroke={active===t.key?'#6B1F1F':'#8A7A6A'}
              strokeWidth={active===t.key?2:1.6} strokeLinecap="round" strokeLinejoin="round">
              <path d={t.icon}/>
            </svg>
            {t.badge > 0 && (
              <span style={{ position:'absolute', top:-4, right:-6, background:'#6B1F1F', color:'white', width:14, height:14, borderRadius:'50%', fontSize:8, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center' }}>{t.badge}</span>
            )}
          </div>
          <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, color:active===t.key?'#6B1F1F':'#8A7A6A', fontWeight:active===t.key?600:400 }}>{t.label}</span>
          {active===t.key && <div style={{ position:'absolute', top:0, left:'50%', transform:'translateX(-50%)', width:20, height:2, background:'#6B1F1F', borderRadius:1 }}></div>}
        </button>
      ))}
    </div>
  );
};

/* ── HOME SCREEN ── */
const HomeScreen = ({ onNav, lang }) => {
  const ur = lang==='ur';
  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      {/* Header */}
      <div style={{ background:'#4A1313', padding:'14px 20px 20px' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
          <div>
            <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#C9A961', letterSpacing:'.1em', marginBottom:4 }}>{ur ? 'السلام علیکم' : 'Good morning'}</div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:22, fontWeight:600, color:'#FAF6EE' }}>{ur ? 'رحیم صاحب' : 'Mr. Rahim'}</div>
          </div>
          <div style={{ display:'flex', gap:10, alignItems:'center' }}>
            <div style={{ background:'rgba(201,169,97,.2)', border:'1px solid rgba(201,169,97,.4)', borderRadius:999, padding:'4px 10px', display:'flex', gap:6 }}>
              <button onClick={()=>{}} style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, color: !ur?'#4A1313':'#C9A961', background: !ur?'#C9A961':'transparent', border:'none', borderRadius:999, padding:'2px 8px', cursor:'pointer', fontWeight:!ur?700:400 }}>EN</button>
              <button onClick={()=>{}} style={{ fontFamily:"'Noto Nastaliq Urdu',serif", fontSize:12, color: ur?'#4A1313':'#C9A961', background: ur?'#C9A961':'transparent', border:'none', borderRadius:999, padding:'2px 8px', cursor:'pointer', fontWeight:ur?700:400 }}>اردو</button>
            </div>
            <div style={{ position:'relative' }}>
              <svg width={20} height={20} viewBox="0 0 24 24" fill="none" stroke="#C9A961" strokeWidth="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9 M13.73 21a2 2 0 01-3.46 0"/></svg>
              <span style={{ position:'absolute', top:-4, right:-4, background:'#8B1F1F', color:'white', width:13, height:13, borderRadius:'50%', fontSize:8, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center' }}>2</span>
            </div>
          </div>
        </div>
        {/* Date strip */}
        <div style={{ marginTop:12, background:'rgba(255,255,255,.07)', borderRadius:8, padding:'8px 12px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#E8D9B5' }}>Friday, 2 May 2026</span>
          <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, color:'#C9A961', opacity:.8 }}>٤ ذو القعدة ١٤٤٧</span>
        </div>
      </div>

      {/* Child cards */}
      <div style={{ flex:1, overflowY:'auto', padding:'16px', background:'#F2EBDB' }}>
        <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, letterSpacing:'.18em', textTransform:'uppercase', color:'#8A7A6A', marginBottom:10 }}>Your children</div>

        {CHILDREN.map(child => {
          const ss = statusStyle(child.status);
          return (
            <div key={child.id} onClick={()=>onNav('child')} style={{
              background:'white', borderRadius:12, marginBottom:12,
              border:'1px solid #D9CDB5', overflow:'hidden', cursor:'pointer',
              boxShadow:'0 2px 8px rgba(74,19,19,.06)',
            }}>
              {/* Card header */}
              <div style={{ background: child.feeBalance > 0 ? '#4A1313' : '#6B1F1F', padding:'14px 16px', display:'flex', alignItems:'center', gap:12 }}>
                <Avatar initials={child.initials} size={44} bg='rgba(201,169,97,.25)' color='#E8D9B5'/>
                <div style={{ flex:1 }}>
                  <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:19, fontWeight:600, color:'#FAF6EE' }}>{ur ? child.nameUr : child.name}</div>
                  <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#C9A961', marginTop:1 }}>{child.grade} · {child.section}</div>
                </div>
                <Badge label={ur ? child.statusUr : child.status} bg={ss.bg} color={ss.color}/>
              </div>
              {/* Card body */}
              <div style={{ padding:'12px 16px' }}>
                {/* Daily note */}
                <div style={{ marginBottom:10 }}>
                  <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, letterSpacing:'.12em', textTransform:'uppercase', color:'#8A7A6A', marginBottom:4 }}>Today's note</div>
                  <p style={{ fontFamily:"'Lora',serif", fontSize:13, color:'#2A1A1A', lineHeight:1.55, direction: ur?'rtl':'ltr' }}>{ur ? child.noteUr : child.note}</p>
                </div>
                {/* Stats row */}
                <div style={{ display:'flex', gap:8, paddingTop:10, borderTop:'1px solid #F2EBDB' }}>
                  <div style={{ flex:1, textAlign:'center' }}>
                    <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:20, fontWeight:600, color:'#3A6B45' }}>{child.attendance}%</div>
                    <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:9, color:'#8A7A6A', letterSpacing:'.08em', textTransform:'uppercase' }}>Attendance</div>
                  </div>
                  <div style={{ width:1, background:'#D9CDB5' }}></div>
                  <div style={{ flex:1, textAlign:'center' }}>
                    <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:20, fontWeight:600, color: child.feeBalance>0?'#8B1F1F':'#3A6B45' }}>
                      {child.feeBalance > 0 ? `PKR ${(child.feeBalance/1000).toFixed(1)}k` : '✓ Clear'}
                    </div>
                    <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:9, color:'#8A7A6A', letterSpacing:'.08em', textTransform:'uppercase' }}>Fee balance</div>
                  </div>
                  <div style={{ width:1, background:'#D9CDB5' }}></div>
                  <div style={{ flex:1, textAlign:'center' }}>
                    <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:20, fontWeight:600, color: child.homework?'#8B6A1F':'#3A6B45' }}>
                      {child.homework ? '1 due' : '✓ None'}
                    </div>
                    <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:9, color:'#8A7A6A', letterSpacing:'.08em', textTransform:'uppercase' }}>Homework</div>
                  </div>
                </div>
              </div>
            </div>
          );
        })}

        {/* Quick actions */}
        <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, letterSpacing:'.18em', textTransform:'uppercase', color:'#8A7A6A', margin:'16px 0 10px' }}>Quick actions</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          {[
            ['Pay fees', '#6B1F1F', '#FAF6EE', ()=>onNav('fees')],
            ['Message teacher', '#FAF6EE', '#4A1313', ()=>onNav('messages')],
            ['View report card', '#FAF6EE', '#4A1313', ()=>{}],
            ['Bus live track', '#FAF6EE', '#4A1313', ()=>{}],
          ].map(([label,bg,color,fn])=>(
            <button key={label} onClick={fn} style={{ background:bg, border:`1px solid ${bg==='#FAF6EE'?'#D9CDB5':bg}`, borderRadius:8, padding:'14px 12px', fontFamily:"'DM Sans',sans-serif", fontSize:12, fontWeight:500, color, cursor:'pointer', textAlign:'left' }}>{label} →</button>
          ))}
        </div>
      </div>

      <BottomNav active="home" onNav={onNav} unread={2}/>
    </div>
  );
};

/* ── CHILD DETAIL SCREEN ── */
const ChildScreen = ({ onNav }) => {
  const child = CHILDREN[0];
  const [tab, setTab] = useState('notes');
  const tabs = [['notes','Notes'],['attendance','Attend.'],['homework','H/W'],['quran','Quran']];
  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      {/* Header */}
      <div style={{ background:'#6B1F1F', padding:'14px 20px 16px' }}>
        <button onClick={()=>onNav('home')} style={{ background:'none', border:'none', color:'#C9A961', fontFamily:"'DM Sans',sans-serif", fontSize:12, cursor:'pointer', marginBottom:10, display:'flex', alignItems:'center', gap:4 }}>← Back</button>
        <div style={{ display:'flex', alignItems:'center', gap:14 }}>
          <Avatar initials={child.initials} size={52} bg='rgba(201,169,97,.25)' color='#E8D9B5'/>

            <input defaultValue="+92 300 123 4567" style={{ width:'100%', padding:'13px 14px', border:'1px solid #D9CDB5', borderRadius:8, fontFamily:"'DM Sans',sans-serif", fontSize:14, background:'#FAF6EE', color:'#2A1A1A', outline:'none' }}/>
          </div>
          <button onClick={()=>setLoggedIn(true)} style={{ width:'100%', background:'#6B1F1F', color:'#FAF6EE', border:'none', borderRadius:8, padding:'15px', fontFamily:"'DM Sans',sans-serif", fontSize:14, fontWeight:500, cursor:'pointer', letterSpacing:'.04em', marginBottom:12 }}>
            Send OTP →
          </button>
          <div style={{ textAlign:'center', fontFamily:"'DM Sans',sans-serif", fontSize:11, color:'#8A7A6A' }}>
            Also available in <span style={{ color:'#6B1F1F', fontFamily:"'Noto Nastaliq Urdu',serif" }}>اردو</span>
          </div>
        </div>
      </div>
    </PhoneShell>
  );

  return (
    <>
      <PhoneShell title="Home">
        <HomeScreen onNav={setScreen} lang={lang}/>
      </PhoneShell>
      <PhoneShell title="Child detail">
        <ChildScreen onNav={setScreen}/>
      </PhoneShell>
      <PhoneShell title="Fees & payment">
        <FeesScreen onNav={setScreen}/>
      </PhoneShell>
      <PhoneShell title="Messages">
        <MessagesScreen onNav={setScreen}/>
      </PhoneShell>
    </>
  );
};

/* ── TWEAKS ── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "mood": "maroon",
  "form": "paper",
  "voice": "bilingual"
}/*EDITMODE-END*/;

// Apply mood + form to <body> as data-attrs so all CSS vars cascade
const applyBody = (t) => {
  document.body.setAttribute('data-mood', t.mood);
  document.body.setAttribute('data-form', t.form);
  document.body.setAttribute('data-voice', t.voice);
};

const Tweaks = ({ tweaks, setTweak }) => {
  const { TweaksPanel, TweakSection, TweakRadio, TweakSelect } = window.TweaksKit || {};
  if (!TweaksPanel) return null;
  return (
    <TweaksPanel title="Tweaks" subtitle="Reshape the parent app">
      <TweakSection label="Mood" hint="Re-tunes every accent across the four screens.">
        <TweakRadio value={tweaks.mood} onChange={v=>setTweak('mood',v)} options={[
          { value:'maroon', label:'Maroon · gold' },
          { value:'garden', label:'Garden · sage' },
          { value:'dusk',   label:'Dusk · copper' },
        ]}/>
      </TweakSection>
      <TweakSection label="Form" hint="How rounded the world is.">
        <TweakRadio value={tweaks.form} onChange={v=>setTweak('form',v)} options={[
          { value:'stone',  label:'Stone' },
          { value:'paper',  label:'Paper' },
          { value:'pillow', label:'Pillow' },
        ]}/>
      </TweakSection>
      <TweakSection label="Voice" hint="Whose tongue leads on every screen.">
        <TweakRadio value={tweaks.voice} onChange={v=>setTweak('voice',v)} options={[
          { value:'bilingual',  label:'Bilingual' },
          { value:'urdu',       label:'Urdu-first' },
          { value:'english',    label:'English' },
        ]}/>
      </TweakSection>
    </TweaksPanel>
  );
};

// Bridge: make data globally read mood/form/voice so existing inner components can use a context-free hook
window.GDS_TWEAKS = TWEAK_DEFAULTS;

const Root = () => {
  const useTweaks = (window.TweaksKit && window.TweaksKit.useTweaks) || ((d)=>[d, ()=>{}]);
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => { applyBody(tweaks); window.GDS_TWEAKS = tweaks; }, [tweaks]);
  return (
    <>
      <App tweaks={tweaks}/>
      <Tweaks tweaks={tweaks} setTweak={setTweak}/>
    </>
  );
};

applyBody(TWEAK_DEFAULTS);
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
